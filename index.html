const J=(k,d)=>{try{return JSON.parse(LG(k))??d}catch(e){return d}};
const cfg=()=>{const c=J('sync.cfg',null);if(c&&c.url&&c.key)return c;return CFG.url&&CFG.key?CFG:null};
let sess=J('sync.sess',null),sstate=J('sync.state',{uid:null,since:'',h:{}}),sbusy=false,sstat=sess?'idle':'out',smsg='',slast=J('sync.last',null);
const saveState=()=>LS('sync.state',JSON.stringify(sstate));
const stable=v=>v===null||typeof v!='object'?JSON.stringify(v):Array.isArray(v)?'['+v.map(stable).join(',')+']':'{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';
const hash=v=>{const s=stable(v);let a=5381,b=52711;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=(a*33)^c;b=(b*31+c)|0}return s.length+'.'+(a>>>0).toString(36)+(b>>>0).toString(36)};
function httpErr(r,j){const e=new Error((j&&(j.error_description||j.msg||j.message||j.hint))||('HTTP '+r.status));e.status=r.status;return e}
async function auth(path,body){const c=cfg();const r=await fetch(c.url.replace(/\/$/,'')+'/auth/v1/'+path,{method:'POST',headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw httpErr(r,j);return j}
function takeSess(j){sess={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1e3)+(j.expires_in||3600),uid:(j.user&&j.user.id)||(sess&&sess.uid),email:(j.user&&j.user.email)||(sess&&sess.email)};LS('sync.sess',JSON.stringify(sess))}
function dropSess(){sess=null;try{localStorage.removeItem('sync.sess')}catch(e){}}
async function token(){if(!sess)throw new Error('Not signed in');
  if(sess.expires_at-60<Date.now()/1e3){try{takeSess(await auth('token?grant_type=refresh_token',{refresh_token:sess.refresh_token}))}
    catch(e){if(e.status===400||e.status===401||e.status===403){dropSess();sstat='out';throw new Error('Signed out. Please sign in again.')}throw e}}
  return sess.access_token}
async function rest(method,path,body,prefer){const c=cfg();
  for(let i=0;i<2;i++){const t=await token();
    const r=await fetch(c.url.replace(/\/$/,'')+'/rest/v1/'+path,{method,headers:{apikey:c.key,Authorization:'Bearer '+t,'Content-Type':'application/json',...(prefer?{Prefer:prefer}:{})},body:body?JSON.stringify(body):undefined});
    if(r.status===401&&i===0){sess.expires_at=0;continue}
    const j=r.status===204?null:await r.json().catch(()=>null);if(!r.ok)throw httpErr(r,j);return j}}

const READY={coaching:()=>{const h=hooks().coaching;return h&&h.exportData?h:null},training:()=>{const h=hooks().training;return h&&h.exportData?h:null}};
function localMap(){const m={},ok={};
  const c=READY.coaching();if(c){ok.coaching=1;const o=c.exportData();for(const k of['days','wk','sent'])for(const d in o[k]||{})m['coaching|'+k+'/'+d]=o[k][d];if(o.set)m['coaching|set']=o.set}
  const t=READY.training();if(t){ok.training=1;const o=t.exportData();for(const k in o)if(k!=='_savedAt'&&o[k]!==undefined)m['training|'+k]=o[k]}
  return{m,ok}}
const split=id=>{const i=id.indexOf('|');return[id.slice(0,i),id.slice(i+1)]};

async function syncNow(manual){
  if(sbusy||!cfg()||!sess)return;
  if(navigator.onLine===false){sstat='offline';paint();return}
  const{ok}=localMap();if(!ok.coaching||!ok.training){if(manual)toast('Still loading…');return}
  sbusy=true;sstat='sync';paint();
  try{
    if(sstate.uid&&sstate.uid!==sess.uid)sstate={uid:sess.uid,since:'',h:{}};
    sstate.uid=sess.uid;
    const first=!sstate.since,h=sstate.h;
    if(first){try{localStorage.setItem('sync.prelocal',JSON.stringify(localMap().m))}catch(e){}}
    // 1) pull everything changed since last time
    let rows=[],since=sstate.since||'1970-01-01T00:00:00Z';
    for(let n=0;n<200;n++){
      const r=await rest('GET','app_data?select=app,key,value,deleted,updated_at&updated_at=gte.'+encodeURIComponent(since)+'&order=updated_at.asc&limit=1000');
      rows=rows.concat(r);if(r.length<1000)break;if(r[r.length-1].updated_at===since)break;since=r[r.length-1].updated_at}
    let lm=localMap().m;const ch={coaching:[],training:[]};let newest=sstate.since;
    for(const r of rows){
      if(!ch[r.app])continue;if(!newest||r.updated_at>newest)newest=r.updated_at;
      const id=r.app+'|'+r.key,rh=r.deleted?'-':hash(r.value),cur=id in lm?hash(lm[id]):'-';
      if(cur===rh){h[id]=rh;continue}
      if(!first&&cur!==(h[id]||'-'))continue;           // changed here too: our version is pushed below and wins
      ch[r.app].push({key:r.key,value:r.value,deleted:!!r.deleted});h[id]=rh}
    let pulled=0;
    for(const a of['coaching','training'])if(ch[a].length){READY[a]().applyRemote(ch[a]);pulled+=ch[a].length}
    if(pulled){lm=localMap().m;for(const a in ch)for(const c of ch[a]){const id=a+'|'+c.key;h[id]=id in lm?hash(lm[id]):'-'}}
    if(newest)sstate.since=newest;else if(first)sstate.since='1970-01-01T00:00:00Z';
    // 2) push what changed here (including deletions)
    const up=[];
    for(const id in lm)if(h[id]!==hash(lm[id])){const[a,k]=split(id);up.push({app:a,key:k,value:lm[id],deleted:false,_id:id,_h:hash(lm[id])})}
    for(const id in h)if(!(id in lm)&&h[id]!=='-'){const[a,k]=split(id);if(ok[a])up.push({app:a,key:k,value:null,deleted:true,_id:id,_h:'-'})}
    for(let i=0;i<up.length;i+=100){const part=up.slice(i,i+100);
      await rest('POST','app_data?on_conflict=user_id,app,key',part.map(({_id,_h,...r})=>r),'resolution=merge-duplicates,return=minimal');
      for(const p of part)h[p._id]=p._h}
    saveState();slast=Date.now();LS('sync.last',String(slast));sstat='ok';smsg=(pulled?pulled+' received':'')+(pulled&&up.length?', ':'')+(up.length?up.length+' sent':'');
    if(manual||pulled)toast(pulled?'Synced – '+pulled+' update'+(pulled==1?'':'s')+' received':'Synced');
  }catch(e){saveState();sstat=sess?'err':'out';smsg=String(e.message||e);if(manual)toast('Sync failed: '+smsg)}
  sbusy=false;paint()}

let swReg=null;
async function checkUpdate(){try{if(navigator.onLine===false)return;
  if(swReg)swReg.update().catch(()=>{});
  const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});if(!r.ok)return;
  const m=(await r.text()).match(/const BUILD='([^']+)'/);if(!m||m[1]===BUILD)return;
  let tried='';try{tried=sessionStorage.getItem('upd')||''}catch(e){}
  if(tried===m[1])return;try{sessionStorage.setItem('upd',m[1])}catch(e){}
  toast('Updating to newest version…');
  if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}
  setTimeout(()=>location.reload(),700)}catch(e){}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{swReg=r}).catch(()=>{});
setTimeout(checkUpdate,1500);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible')checkUpdate()});
addEventListener('online',checkUpdate);
addEventListener('pageshow',e=>{if(e.persisted)checkUpdate()});
