const SRC={coaching:"\u003c!doctype html>\n\u003chtml lang=\"en-GB\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n\u003ctitle>Coaching Log\u003c/title>\n\u003cstyle>\n:root{--bg:#f5f7f7;--card:#fff;--tx:#14201f;--mu:#5d6d6b;--ac:#0f766e;--bd:#d5dedd;--good:#15803d;--bad:#b45309}\n@media(prefers-color-scheme:dark){:root{--bg:#0e1514;--card:#17211f;--tx:#e6efee;--mu:#93a4a1;--ac:#2dd4bf;--bd:#2a3836;--good:#4ade80;--bad:#fbbf24}}\n*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(70px + var(--sab,env(safe-area-inset-bottom)))}\nheader{position:sticky;top:0;z-index:5;display:flex;gap:8px;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--bd)}\nheader input{flex:1;min-width:0;width:100%;text-align:center}header button{flex:0 0 48px}\nbutton,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;min-height:44px}\ninput,select,textarea{width:100%;max-width:100%;min-width:0;-webkit-appearance:none;appearance:none}input[type=date]{display:block}input[type=checkbox]{width:22px;height:22px;appearance:auto;-webkit-appearance:checkbox;flex:none}select{text-overflow:ellipsis;padding-right:6px}\nmain{padding:10px;max-width:640px;margin:auto;overflow-x:hidden}\ndetails{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px}\nsummary{padding:12px;font-weight:600;color:var(--ac)}\n.g{padding:0 12px 8px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 10px}\n.f{display:flex;flex-direction:column;gap:3px;min-width:0}.f.w{grid-column:1/-1}\nlabel{font-size:13px;color:var(--mu)}label i{font-style:normal;opacity:.8}\n.sc{display:flex;gap:4px}.sc button{flex:1 1 0;min-width:0;padding:0;min-height:40px}\n.on{background:var(--ac)!important;color:#fff!important;border-color:var(--ac)!important}\nnav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;padding:8px 10px calc(8px + var(--sab,env(safe-area-inset-bottom)));background:var(--bg);border-top:1px solid var(--bd)}\nnav button{flex:1;min-width:0}\n.p{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}\n.p h3{margin:0 0 8px;font-size:15px}.p button{width:100%;margin-top:6px;white-space:normal}.p small{color:var(--mu)}\nsvg.ch{width:100%;height:auto;display:block}.ch text{fill:var(--mu);font-size:10px}.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}.kp div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 6px;text-align:center}.kp b{display:block;font-size:20px}.kp small{color:var(--mu);font-size:12px}.dn{color:var(--good)}.up{color:var(--bad)}.tw{overflow-x:auto}\ntable{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 3px;text-align:right;border-bottom:1px solid var(--bd)}th:first-child,td:first-child{text-align:left}\n.sb{padding:8px 12px;border-radius:10px;margin-bottom:10px;font-size:14px;border:1px solid var(--bd,#d5dedd);background:var(--card,#fff)}.sb.synced{border-left:4px solid #16a34a}.sb.pending,.sb.offline{border-left:4px solid #d97706}.sb.error,.sb.local{border-left:4px solid #dc2626}\n#t{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000;color:#fff;padding:8px 14px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cheader>\u003cbutton id=pv>‹\u003c/button>\u003cinput type=date id=dt>\u003cbutton id=nx>›\u003c/button>\u003c/header>\n\u003cmain id=app>\u003c/main>\n\u003cnav>\u003cbutton data-v=day>Day\u003c/button>\u003cbutton data-v=week>Week\u003c/button>\u003cbutton data-v=prog>Progress\u003c/button>\u003cbutton data-v=data>Sync\u003c/button>\u003c/nav>\n\u003cdiv id=t>\u003c/div>\n\u003cscript>\nconst QS=(()=>{try{return window.top.__QS||''}catch(e){return ''}})();\nconst BUILD=(()=>{try{return window.top.BUILD||''}catch(e){return ''}})();\nconst SC='Coaching Nutrition'; // Shortcut name; the app passes it the selected date\nconst K='coachlog.v1',$=s=>document.querySelector(s),app=$('#app');\nconst iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);\nconst pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};\nconst add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};\nconst sun=s=>add(s,-pd(s).getDay());\nconst DN=['SUN','MON','TUE','WED','THU','FRI','SAT'];\nlet S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}\nS=S||{set:{sw:119.8,p:200,f:65,c:180,steps:10000,cardio:'3X10 MINS'},days:{},wk:{},sent:{},bk:null};\nS.sent=S.sent||{};\nconst save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Could not save: '+e)}};\nif(navigator.storage&&navigator.storage.persist)navigator.storage.persist();\nlet cur=iso(new Date()),view='day';\nconst esc=s=>String(s).replace(/&/g,'&amp;').replace(/\"/g,'&quot;').replace(/\u003c/g,'&lt;');\nconst MD=['LOW','MODERATE','HIGH','TRAINING','REST','DIET BREAK','PLAN'];\n// [key,label,type,sheet column]  type: n=number, t=text, s=1-7 scale, array=dropdown\nconst OPEN=new Set(['Weight','Nutrition','Training & cardio']);\nconst SEC=[\n['Weight',[['weight','Bodyweight (kg)','n','E']]],\n['Nutrition',[['macro','Macro day',MD,'G'],['protein','Protein (g)','n','H'],['fats','Fats (g)','n','I'],['carbs','Carbs (g)','n','J'],['kcal','Calories (auto)','n','K'],['fibre','Fibre intake','n','M'],['fluid','Fluid (litres)','n','N'],['hunger','Hunger levels','s','O'],['craving','Craving levels','s','P'],['offplan','Off plan meal – what was it?','t','Q']]],\n['Training & cardio',[['sessions','Sessions',['WEIGHTS','CARDIO','WEIGHTS & CARDIO','STEPS ONLY','REST'],'T'],['steps','Steps','n','U'],['cardio','Cardio (cals burnt only or mins active)','n','V'],['motiv','Motivation to train','s','W'],['perf','Performance','s','X'],['enjoy','Enjoyment','s','Y']]],\n['Recovery & stress',[['sore','Muscle soreness','s','AA'],['energy','Energy levels','s','AB'],['stress','Stress levels','s','AC']]],\n['Digestion',[['stoolf','Frequency of stool movements',['1','2','3','4','5+'],'AE'],['stoolq','Quality of stool',['LOOSE','REGULAR','SOLID'],'AF'],['gi','GI distress (gas/bloating)','s','AG']]],\n['Sleep',[['slh','Sleep hours','n','AI'],['slm','Sleep mins','n','AJ'],['slq','Quality of sleep','s','AK']]],\n['Health markers',[['sys','Blood pressure SYS','n','AM'],['dia','Blood pressure DIA','n','AN'],['rhr','RHR','n','AO'],['glu','Blood glucose','n','AP']]],\n['Additional notes',[['notes','Details, slip ups & reasoning','t','AX']]]];\nconst FL=SEC.flatMap(s=>s[1]);\nconst HINT={protein:()=>S.set.p,fats:()=>S.set.f,carbs:()=>S.set.c,steps:()=>S.set.steps,cardio:()=>S.set.cardio};\nconst day=()=>S.days[cur]=S.days[cur]||{};\nfunction fld([k,l,t],d){const v=d[k]??'',h=HINT[k]?` \u003ci>(target ${HINT[k]()})\u003c/i>`:'';let x=`\u003clabel>${l}${h}\u003c/label>`;\nif(t=='s')x+='\u003cdiv class=sc>'+[1,2,3,4,5,6,7].map(n=>`\u003cbutton type=button data-k=${k} data-s=${n} class=\"${v==n?'on':''}\">${n}\u003c/button>`).join('')+'\u003c/div>';\nelse if(Array.isArray(t))x+=`\u003cselect data-k=${k}>\u003coption value=\"\">–\u003c/option>${t.map(o=>`\u003coption${v==o?' selected':''}>${o}\u003c/option>`).join('')}\u003c/select>`;\nelse if(t=='t')x+=`\u003ctextarea data-k=${k} rows=3>${esc(v)}\u003c/textarea>`;\nelse x+=`\u003cinput data-k=${k} inputmode=decimal value=\"${esc(v)}\">`;\nreturn `\u003cdiv class=\"f${t=='t'||Array.isArray(t)||k=='cardio'||k=='offplan'?' w':''}\">${x}\u003c/div>`}\nconst num=v=>v===undefined||v===''||isNaN(+v)?null:+v;\nconst SI=()=>{try{return window.top.syncInfo('coaching')}catch(e){return{state:'local',text:'Saved on this device only'}}};\nconst SIC={synced:'☁ ✓',pending:'☁ …',offline:'☁ ⏸',error:'☁ !',local:'📱'};\nconst sbHTML=()=>{const i=SI();return`\u003cdiv class=\"sb ${i.state}\">${SIC[i.state]||''} ${esc(i.text)}\u003c/div>`};\nconst dayMsg=sbHTML;\nfunction weekRows(w){return Array.from({length:7},(_,i)=>{const dt=add(w,i);return[dt,S.days[dt]||{}]})}\nfunction tsv(w,cols,mode){return weekRows(w).map(([,d])=>{const o=[];for(const c of cols)o.push(String(d[c]??'').replace(/[\\t\\r\\n]+/g,' '));return o.join('\\t')}).join('\\n')}\nconst L2N=l=>[...l].reduce((a,c)=>a*26+c.charCodeAt(0)-64,0);\nconst colmap=Object.fromEntries(FL.filter(f=>f[3]!='AX').map(f=>[L2N(f[3]),f[0]]));\nconst mainCols=[];for(let i=L2N('E');i\u003c=L2N('AP');i++)mainCols.push(colmap[i]||'_');\nconst mainTSV=(w,p)=>weekRows(w).map(([,d])=>part(mainCols.map(c=>c=='_'?'':String(d[c]??'')),p).join('\\t')).join('\\n');\nconst dayRow=()=>+S.set.row||13;\nconst part=(c,p)=>p=='a'?c.slice(0,6):p=='k'?c.slice(6,7):p=='b'?c.slice(8):c;\nconst dayTSV=(dt,p)=>{const d=S.days[dt]||{};return part(mainCols.map(c=>c=='_'?'':String(d[c]??'').replace(/[\\t\\r\\n]+/g,' ')),p).join('\\t')};\nfunction render(){\n$('#dt').value=cur;$('#dt').style.display=view=='day'?'':'none';$('#pv').style.display=$('#nx').style.display=(view=='data'||view=='prog')?'none':'';\ndocument.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==view));\nif(view=='day'){const d=S.days[cur]||{};app.innerHTML=dayMsg()+`\u003cdiv class=p>\u003cb>${DN[pd(cur).getDay()]} ${pd(cur).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}\u003c/b>\u003cbutton data-c=food>↻ Import metrics${cur==iso(new Date())?'':' for '+cur.slice(8)+'/'+cur.slice(5,7)}\u003c/button>\u003c/div>`+SEC.map((s,i)=>`\u003cdetails data-s=\"${esc(s[0])}\"${OPEN.has(s[0])?' open':''}>\u003csummary>${s[0]}\u003c/summary>\u003cdiv class=g>${s[1].map(f=>fld(f,d)).join('')}\u003c/div>\u003c/details>`).join('')+`\u003cdiv class=p>\u003ch3>Copy to Google Sheet\u003c/h3>\u003csmall>Paste at \u003cb>E${dayRow()+pd(cu \n\n    \u003cdiv class=\"confirm-wrap hidden\" id=\"confirmWrap\" role=\"alertdialog\" aria-modal=\"true\">\n        \u003cdiv class=\"confirm-card\">\n            \u003cp id=\"confirmMsg\">\u003c/p>\n            \u003cdiv class=\"confirm-btns\">\n                \u003cbutton type=\"button\" id=\"confirmNo\">Cancel\u003c/button>\n                \u003cbutton type=\"button\" id=\"confirmYes\">OK\u003c/button>\n            \u003c/div>\n        \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"picker hidden\" id=\"autoGen\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Auto-create a program\">\n        \u003cdiv class=\"pk-top\">\n            \u003cstrong>Auto-create program\u003c/strong>\n            \u003cbutton type=\"button\" id=\"agClose\">Cancel\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"pk-scroll ag-body\" id=\"agScroll\">\n            \u003ch3>How long do you have?\u003c/h3>\n            \u003cdiv class=\"ag-chips\" id=\"agDur\">\u003c/div>\n            \u003ch3>Body areas to train\u003c/h3>\n            \u003cdiv class=\"ag-chips\" id=\"agPresets\">\u003c/div>\n            \u003cdiv class=\"ag-chips\" id=\"agAreas\" style=\"margin-top:0.5rem\">\u003c/div>\n            \u003ch3>Equipment\u003c/h3>\n            \u003cselect class=\"fld\" id=\"agEquip\" aria-label=\"Equipment\">\n                \u003coption value=\"dbbw\">Dumbbells and bodyweight (home)\u003c/option>\n                \u003coption value=\"db\">Dumbbells only\u003c/option>\n                \u003coption value=\"all\">Full gym (machines and cables too)\u003c/option>\n            \u003c/select>\n            \u003ch3>Goal\u003c/h3>\n            \u003cselect class=\"fld\" id=\"agGoal\" aria-label=\"Goal\">\n                \u003coption value=\"muscle\">Build muscle\u003c/option>\n                \u003coption value=\"strength\">Build strength\u003c/option>\n                \u003coption value=\"endurance\">Fat loss / conditioning\u003c/option>\n            \u003c/select>\n            \u003cbutton type=\"button\" class=\"ed-primary ag-go\" id=\"agGo\">Create my program\u003c/button>\n        \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"picker hidden\" id=\"picker\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Add exercise\">\n        \u003cdiv class=\"pk-top\">\n            \u003cstrong>Add exercise\u003c/strong>\n            \u003cbutton type=\"button\" id=\"pkDone\">Done\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"pk-filters\">\n            \u003cinput class=\"fld\" type=\"search\" id=\"pkSearch\" placeholder=\"Search exercises\" autocomplete=\"off\" autocapitalize=\"off\" aria-label=\"Search exercises\">\n            \u003cselect class=\"fld\" id=\"pkEquip\" aria-label=\"Equipment\">\n                \u003coption value=\"dbbw\">Dumbbell + bodyweight\u003c/option>\n                \u003coption value=\"db\">Dumbbell only\u003c/option>\n                \u003coption value=\"bw\">Bodyweight only\u003c/option>\n                \u003coption value=\"mc\">Machine / cable\u003c/option>\n                \u003coption value=\"all\">All equipment\u003c/option>\n            \u003c/select>\n            \u003cdiv class=\"pk-chips\" id=\"pkChips\">\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"pk-scroll\" id=\"pkScroll\">\n            \u003cdiv id=\"pkList\">\u003c/div>\n            \u003cdiv class=\"pk-custom\">\n                \u003ch3>Not listed? Add your own\u003c/h3>\n                \u003cinput class=\"fld\" type=\"text\" id=\"pkCName\" maxlength=\"50\" placeholder=\"Exercise name\" aria-label=\"Custom exercise name\">\n                \u003cdiv class=\"pk-row\">\n                    \u003cselect class=\"fld\" id=\"pkCGroup\" aria-label=\"Muscle group\">\u003c/select>\n                    \u003cselect class=\"fld\" id=\"pkCKind\" aria-label=\"Exercise type\">\u003c/select>\n                \u003c/div>\n                \u003cbutton type=\"button\" id=\"pkCAdd\">Add custom exercise\u003c/button>\n            \u003c/div>\n        \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"rest-bar hidden\" id=\"restBar\" role=\"status\" aria-live=\"polite\">\n        \u003cdiv class=\"rest-info\">\n            \u003cdiv class=\"rest-label\" id=\"restLabel\">Rest\u003c/div>\n            \u003cdiv class=\"rest-time\" id=\"restTime\">0:00\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"rest-actions\">\n            \u003cbutton id=\"restMinus\" type=\"button\">-15s\u003c/button>\n            \u003cbutton id=\"restPlus\" type=\"button\">+15s\u003c/button>\n            \u003cbutton id=\"restSkip\" type=\"button\">Skip\u003c/button>\n        \u003c/div>\n    \u003c/div>\n\n    \u003cinput type=\"file\" id=\"fileInput\" accept=\".json\" />\n\n    \u003cscript>\n        const STORAGE_KEY = 'trainingTrackerData';\n        const HOME_EXERCISES = [\n            { bodyPart: 'Biceps', exercise: 'Alternating Dumbbell Curls', repRange: '8-12', sets: '3-5', video: 'https://www.youtube.com/shorts/MKWBV29S6c0' },\n            { bodyPart: 'Biceps', exercise: 'Dumbbell Hammer Curls', repRange: '8-12', sets: '3-5', video: 'https://www.youtube.com/shorts/IEuVnX7nZN8' },\n            { bodyPart: 'Back', exercise: 'Pullover Dumbbell', repRange: '8-12', sets: '3-5', video: 'https://www.youtube.com/shorts/Datv2L6t3-4' },\n            { bodyPart: 'Triceps', exercise: 'Bench Dips', repRange: '8-12', sets: '3-5', video: 'https://www.youtube.com/shorts/4ua3MzaU0QU' },\n            { bodyPart: 'Shoulders', exercise: 'Shoulder Press Dumbbell', repRange: '8-12', sets: '3-5', video: 'https://www.youtube.com/shorts/k6tzKisR3NY' },\n            { bodyPart: 'Chest', exercise: 'Flat Bench Press Dumbbell', repRange: '8-12', sets: '3-5', video: 'https://www.youtube.com/shorts/mTaiQemkEpU' },\n            { bodyPart: 'Legs', exercise: 'Romanian Deadlifts Dumbbell', repRange: '8-12', sets: '3-5', video: 'https://www.youtube.com/shorts/hu3jRvTc_po' }\n        ];\n\n        const GYM_EXERCISES = [\n            { bodyPart: 'Biceps', exercise: 'Single Arm D-Handle Curls', repRange: '8-12', sets: '3-5', video: 'https://www.youtube.com/shorts/d17ihQT4EjI' },\n            { bodyPart: 'Biceps', exercise: 'Cable Rope Curls', repRange: '8-12', sets: '3-5', video: 'https://www.youtube.com/shorts/TCeIYlq00P8' },\n            { bodyPart: 'Triceps', exercise: 'Rope Pushdown', repRange: '8-12', sets: '3-5', video: 'https://www.youtube.com/shorts/4NWWB0f0vzQ' },\n            { bodyPart: 'Chest', exercise: 'Chest Press Machine', repRange: '8-12', sets: '3-5', video: 'https://www.youtube.com/shorts/E7fl51PkEn4' },\n            { bodyPart: 'Shoulders', exercise: 'Lat Raises Cable Machine', repRange: '8-12', sets: '3-5', video: 'https://www.youtube.com/shorts/lMJUXEvcMkQ' },\n            { bodyPart: 'Back', exercise: 'Lat Pulldown', repRange: '8-12', sets: '3-5', video: 'https://www.youtube.com/shorts/JFYBQMYFiFQ' },\n            { bodyPart: 'Legs', exercise: 'Leg Press', repRange: '8-12', sets: '3-5', video: 'https://www.youtube.com/shorts/nuS8RHADVfg' },\n            { bodyPart: 'Calves', exercise: 'Leg Press Calf Raises', repRange: '20-30', sets: '1-3', video: 'https://www.youtube.com/shorts/aNwI_Trh5z4' },\n            { bodyPart: 'Abdomen', exercise: 'Plank Dumbbell Drags', repRange: 'Full', sets: '3' },\n            { bodyPart: 'Abdomen', exercise: 'Suitcases', repRange: 'Full', sets: '4' }\n        ];\n\n        /* ---------- Exercise database ---------- */\n        // Rest defaults follow ACSM/NSCA-style guidance: about 2-3 min for heavy multi-joint lifts,\n        // 1-2 min for general hypertrophy work, 30-60 s for small isolation, core and calf work.\n        const KIND = {\n            cl: { label: 'Big leg / hip lift',          rest: 150, reps: '8-12',  sets: '3-4' },\n            cu: { label: 'Upper-body compound',         rest: 120, reps: '8-12',  sets: '3-4' },\n            sl: { label: 'Single-leg work',             rest: 90,  reps: '8-12',  sets: '3' },\n            sc: { label: 'Semi-compound / secondary',   rest: 90,  reps: '10-12', sets: '3' },\n            is: { label: 'Isolation (curls, raises)',   rest: 60,  reps: '10-15', sets: '3' },\n            co: { label: 'Core',                        rest: 45,  reps: '12-20', sets: '3' },\n            ca: { label: 'Calves',                      rest: 45,  reps: '15-25', sets: '3' },\n            cv: { label: 'Conditioning / full body',    rest: 90,  reps: '8-12',  sets: '3' }\n        };\n\n        const GROUPS = ['Chest', 'Back', 'Shoulders', 'Biceps', 'Triceps', 'Forearms', 'Legs', 'Glutes', 'Calves', 'Abdomen', 'Full body'];\n        const EQUIP_DB = 'Dumbbell', EQUIP_BW = 'Bodyweight', EQUIP_MC = 'Machine / cable';\n        const EXERCISE_DB = [];\n        function dbAdd(group, equip, text) {\n            text.trim().split('\\n').forEach(line => {\n                const parts = line.trim().split('|');\n                const name = (parts[0] || '').trim(), kind = (parts[1] || '').trim();\n                if (name && KIND[kind]) EXERCISE_DB.push({ exercise: name, bodyPart: group, equip, kind });\n            });\n        }\n\n        dbAdd('Chest', EQUIP_DB, `\nFlat Bench Press Dumbbell|cu\nIncline Dumbbell Press|cu\nDecline Dumbbell Press|cu\nNeutral Grip Dumbbell Press|cu\nSingle Arm Dumbbell Bench Press|cu\nAlternating Dumbbell Bench Press|cu\nDumbbell Floor Press|cu\nDumbbell Squeeze Press|sc\nDumbbell Flyes|sc\nIncline Dumbbell Flyes|sc\nDecline Dumbbell Flyes|sc\nDumbbell Floor Flyes|sc\nSvend Press|is`);\n        dbAdd('Chest', EQUIP_BW, `\nPush-Ups|sc\nIncline Push-Ups|sc\nDecline Push-Ups|sc\nChest Dips|cu`);\n        dbAdd('Chest', EQUIP_MC, `\nChest Press Machine|cu\nIncline Chest Press Machine|cu\nPec Deck|sc\nCable Fly|sc\nLow to High Cable Fly|sc\nHigh to Low Cable Fly|sc`);\n\n        dbAdd('Back', EQUIP_DB, `\nSingle Arm Dumbbell Row|cu\nBent Over Dumbbell Row|cu\nChest Supported Dumbbell Row|cu\nKroc Row|cu\nSeal Row Dumbbell|cu\nRenegade Row|sc\nPullover Dumbbell|sc`);\n        dbAdd('Back', EQUIP_BW, `\nPull-Ups|cu\nChin-Ups|cu\nInverted Row|cu\nBack Extension|sc\nSuperman|co`);\n        dbAdd('Back', EQUIP_MC, `\nLat Pulldown|cu\nClose Grip Lat Pulldown|cu\nSeated Cable Row|cu\nMachine Row|cu\nStraight Arm Pulldown|sc\nAssisted Pull-Up Machine|cu`);\n\n        dbAdd('Shoulders', EQUIP_DB, `\nShoulder Press Dumbbell|cu\nSeated Dumbbell Shoulder Press|cu\nArnold Press|cu\nSingle Arm Dumbbell Shoulder Press|cu\nDumbbell Push Press|cu\nDumbbell Lateral Raises|is\nSeated Dumbbell Lateral Raises|is\nLeaning Single Arm Lateral Raise|is\nDumbbell Front Raises|is\nReverse Dumbbell Flyes|is\nBent Over Rear Delt Raises|is\nDumbbell Upright Row|sc\nDumbbell Y Raises|is\nDumbbell Cuban Press|is\nDumbbell Shrugs|is`);\n        dbAdd('Shoulders', EQUIP_BW, `\nPike Push-Ups|sc`);\n        dbAdd('Shoulders', EQUIP_MC, `\nLat Raises Cable Machine|is\nShoulder Press Machine|cu\nRear Delt Machine|is\nFace Pull|is\nCable Front Raise|is`);\n\n        dbAdd('Biceps', EQUIP_DB, `\nAlternating Dumbbell Curls|is\nDumbbell Hammer Curls|is\nStanding Dumbbell Curls|is\nSeated Dumbbell Curls|is\nIncline Dumbbell Curls|is\nConcentration Curls|is\nSingle Arm Dumbbell Preacher Curls|is\nZottman Curls|is\nCross Body Hammer Curls|is\nDumbbell Spider Curls|is\nDumbbell Drag Curls|is\nDumbbell Curl to Press|sc`);\n        dbAdd('Biceps', EQUIP_MC, `\nSingle Arm D-Handle Curls|is\nCable Rope Curls|is\nCable Curls|is\nPreacher Curl Machine|is`);\n\n        dbAdd('Triceps', EQUIP_DB, `\nDumbbell Overhead Triceps Extension|is\nSingle Arm Overhead Triceps Extension|is\nLying Dumbbell Triceps Extension|is\nDumbbell Triceps Kickbacks|is\nClose Grip Dumbbell Press|sc\nDumbbell Tate Press|is\nDumbbell JM Press|sc`);\n        dbAdd('Triceps', EQUIP_BW, `\nBench Dips|sc\nDiamond Push-Ups|sc\nClose Grip Push-Ups|sc\nParallel Bar Dips|cu`);\n        dbAdd('Triceps', EQUIP_MC, `\nRope Pushdown|is\nStraight Bar Triceps Pushdown|is\nOverhead Cable Triceps Extension|is\nTriceps Dip Machine|sc`);\n\n        dbAdd('Forearms', EQUIP_DB, `\nDumbbell Wrist Curls|is\nDumbbell Reverse Wrist Curls|is\nReverse Dumbbell Curls|is`);\n\n        dbAdd('Legs', EQUIP_DB, `\nGoblet Squat|cl\nDumbbell Squat|cl\nDumbbell Front Squat|cl\nDumbbell Sumo Squat|cl\nHeel Elevated Goblet Squat|cl\nRomanian Deadlifts Dumbbell|cl\nDumbbell Stiff Leg Deadlift|cl\nDumbbell Deadlift|cl\nSingle Leg Romanian Deadlift Dumbbell|sl\nBulgarian Split Squat Dumbbell|sl\nDumbbell Split Squat|sl\nDumbbell Reverse Lunges|sl\nDumbbell Walking Lunges|sl\nDumbbell Forward Lunges|sl\nDumbbell Lateral Lunges|sl\nDumbbell Curtsy Lunges|sl\nDumbbell Step-Ups|sl\nDumbbell Cossack Squats|sl\nDumbbell Hamstring Curls|is`);\n        dbAdd('Legs', EQUIP_BW, `\nBodyweight Squats|sc\nJump Squats|sc\nNordic Hamstring Curl|sc\nWall Sit|co`);\n        dbAdd('Legs', EQUIP_MC, `\nLeg Press|cl\nHack Squat Machine|cl\nSmith Machine Squat|cl\nLeg Extension|is\nSeated Leg Curl|is\nLying Leg Curl|is\nHip Abduction Machine|is\nHip Adduction Machine|is`);\n\n        dbAdd('Glutes', EQUIP_DB, `\nDumbbell Hip Thrust|cl\nSingle Leg Dumbbell Hip Thrust|sl\nDumbbell Glute Bridge|sc\nSingle Leg Dumbbell Glute Bridge|sc\nDumbbell Sumo Deadlift|cl\nDumbbell Good Mornings|sc\nDumbbell Frog Pumps|sc`);\n        dbAdd('Glutes', EQUIP_BW, `\nGlute Bridge|sc\nDonkey Kicks|is\nFire Hydrants|is`);\n        dbAdd('Glutes', EQUIP_MC, `\nCable Glute Kickback|is\nCable Pull-Through|sc`);\n\n        dbAdd('Calves', EQUIP_DB, `\nStanding Dumbbell Calf Raises|ca\nSingle Leg Dumbbell Calf Raises|ca\nSeated Dumbbell Calf Raises|ca`);\n        dbAdd('Calves', EQUIP_BW, `\nBodyweight Calf Raises|ca`);\n        dbAdd('Calves', EQUIP_MC, `\nLeg Press Calf Raises|ca\nStanding Calf Raise Machine|ca\nSeated Calf Raise Machine|ca`);\n\n        dbAdd('Abdomen', EQUIP_DB, `\nPlank Dumbbell Drags|co\nSuitcases|co\nDumbbell Russian Twists|co\nWeighted Dumbbell Crunches|co\nDumbbell Side Bends|co\nDumbbell Woodchoppers|co\nDumbbell Windmills|co\nWeighted Sit-Ups|co`);\n        dbAdd('Abdomen', EQUIP_BW, `\nPlank|co\nSide Plank|co\nDead Bug|co\nBird Dog|co\nHollow Hold|co\nBicycle Crunches|co\nCrunches|co\nReverse Crunches|co\nLeg Raises|co\nHanging Knee Raises|co\nMountain Climbers|co`);\n        dbAdd('Abdomen', EQUIP_MC, `\nCable Crunch|co\nAb Crunch Machine|co\nPallof Press|co\nCable Woodchoppers|co`);\n\n        dbAdd('Full body', EQUIP_DB, `\nDumbbell Thrusters|cv\nDumbbell Clean and Press|cv\nDumbbell Snatch|cv\nDumbbell Swings|cv\nDevil Press|cv\nMan Makers|cv\nTurkish Get-Up|cv\nFarmer's Carry|cv`);\n        dbAdd('Full body', EQUIP_BW, `\nBurpees|cv\nBear Crawl|cv`);\n\n        const DB_BY_NAME = new Map(EXERCISE_DB.map(e => [e.exercise.toLowerCase(), e]));\n        function dbFind(name) { return DB_BY_NAME.get(String(name).toLowerCase()) || null; }\n\n        // Make every exercise object well-formed (also used for imported programs)\n        function normEx(ex) {\n            ex.exercise = String(ex.exercise == null ? '' : ex.exercise);\n            ex.bodyPart = String(ex.bodyPart == null ? '' : ex.bodyPart);\n            ex.repRange = String(ex.repRange == null ? '8-12' : ex.repRange);\n            ex.sets = /^\\d{1,2}(-\\d{1,2})?$/.test(String(ex.sets)) ? String(ex.sets) : '3';\n            if (!KIND[ex.kind]) { const d = dbFind(ex.exercise); ex.kind = d ? d.kind : 'sc'; }\n            if (typeof ex.rest !== 'number' || !(ex.rest > 0)) ex.rest = KIND[ex.kind].rest;\n            return ex;\n        }\n        HOME_EXERCISES.forEach(normEx);\n        GYM_EXERCISES.forEach(normEx);\n\n        /* ---------- Programs (built-in + your own) ---------- */\n        const PLANS = {};\n        const BUILTIN_PLANS = {\n            gym:  { name: 'Gym',  title: 'Gym · Full body', sub: 'Full body session', exercises: GYM_EXERCISES },\n            home: { name: 'Home', title: 'Home workout',         sub: 'Dumbbell session',  exercises: HOME_EXERCISES }\n        };\n        function isCustom(id) { return !BUILTIN_PLANS[id]; }\n        function customPrograms() {\n            if (!data._programs || typeof data._programs !== 'object' || Array.isArray(data._programs)) data._programs = {};\n            return data._programs;\n        }\n        function hiddenPlans() { return (data._hidden && typeof data._hidden === 'object' && !Array.isArray(data._hidden)) ? data._hidden : {}; }\n        function planIds() { return Object.keys(BUILTIN_PLANS).filter(id => !hiddenPlans()[id]).concat(Object.keys(customPrograms())); }\n        function planOrder() { const ids = planIds(); return (ids.includes(currentPlan) ? [currentPlan] : []).concat(ids.filter(p => p !== currentPlan)); }\n        function planName(id) { return BUILTIN_PLANS[id] ? BUILTIN_PLANS[id].name : ((customPrograms()[id] || {}).name || 'Program'); }\n        function planTitle(id) { return BUILTIN_PLANS[id] ? BUILTIN_PLANS[id].title : planName(id); }\n        function planSub(id) {\n            if (BUILTIN_PLANS[id]) return hasOverride(id) ? `${BUILTIN_PLANS[id].sub} \\u00b7 customised` : BUILTIN_PLANS[id].sub;\n            const n = ((customPrograms()[id] || {}).exercises || []).length;\n            return `Your program · ${n} exercise${n === 1 ? '' : 's'}`;\n        }\n        function hasOverride(id) {\n            const o = data._overrides;\n            return !!(BUILTIN_PLANS[id] && o && typeof o === 'object' && o[id] && Array.isArray(o[id].exercises) && o[id].exercises.length);\n        }\n        function ownsRest(id) { return isCustom(id) || hasOverride(id); }\n        function rebuildPlans() {\n            if (data._overrides && typeof data._overrides === 'object') {\n                Object.keys(data._overrides).forEach(id => {\n                    const o = data._overrides[id];\n                    if (!BUILTIN_PLANS[id] || !o || !Array.isArray(o.exercises) || !o.exercises.length) { delete data._overrides[id]; return; }\n                    o.exercises = o.exercises.filter(e => e && typeof e === 'object').map(normEx);\n                });\n            }\n            Object.keys(PLANS).forEach(k => delete PLANS[k]);\n            const progs = customPrograms();\n            Object.keys(progs).forEach(id => {\n                const p = progs[id];\n                if (!p || !Array.isArray(p.exercises) || !p.exercises.length || BUILTIN_PLANS[id]) { delete progs[id]; return; }\n                p.name = String(p.name || 'Program');\n                p.exercises = p.exercises.filter(e => e && typeof e === 'object').map(normEx);\n            });\n            planIds().forEach(id => {\n                const list = hasOverride(id) ? data._overrides[id].exercises : (BUILTIN_PLANS[id] ? BUILTIN_PLANS[id].exercises : progs[id].exercises);\n                PLANS[id] = {};\n                for (let w = 1; w \u003c= 16; w++) PLANS[id][w] = list;\n            });\n            if (!PLANS[currentPlan]) currentPlan = planIds()[0] || 'gym';\n        }\n\n        let currentPlan = 'gym';\n        let currentWeek = 1;\n        const DAYS = [['mon','Mon'],['tue','Tue'],['wed','Wed'],['thu','Thu'],['fri','Fri'],['sat','Sat'],['sun','Sun']];\n        let currentDay = ['sun','mon','tue','wed','thu','fri','sat'][new Date().getDay()];\n        let view = 'home';\n        let data = {};\n\n        function initializeData() {\n            let stored = null;\n            try { stored = localStorage.getItem(STORAGE_KEY); } catch (e) {}\n            BK.lsState = stored === null ? 'missing' : 'ok';\n            if (stored) {\n                try {\n                    const d = JSON.parse(stored);\n                    if (!d || typeof d !== 'object' || Array.isArray(d)) throw new Error('bad shape');\n                    data = d;\n                } catch (e) {\n                    BK.lsState = 'corrupt';\n                    data = {};\n                    lsSet(STORAGE_KEY + '.corrupt', stored); // keep the damaged text, just in case\n                }\n            }\n            rebuildPlans();\n        }\n\n        function saveData() {\n            data._savedAt = Date.now();\n            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }\n            catch (e) { showToast('Could not save: browser storage is full or blocked'); }\n            if (typeof scheduleBackup === 'function') scheduleBackup();\n        }\n\n        function getExerciseKey(week, index) {\n            return `${currentPlan}_${week}_${currentDay}_${index}`;\n        }\n\n        function renderLog() {\n            const container = document.getElementById('exercisesContainer');\n            const emptyState = document.getElementById('emptyState');\n            const exercises = PLANS[currentPlan][currentWeek];\n\n            container.innerHTML = '';\n\n            if (!exercises || exercises.length === 0) {\n                emptyState.classList.remove('hidden');\n                return;\n            }\n\n            emptyState.classList.add('hidden');\n\n            container.appendChild(buildSessionCard('warmup'));\n\n            exercises.forEach((exercise, index) => {\n                const key = getExerciseKey(currentWeek, index);\n                const exerciseData = data[key] || { loggedSets: [] };\n\n                if (!exerciseData.loggedSets) {\n                    exerciseData.loggedSets = [];\n                }\n\n                const card = document.createElement('div');\n                card.className = 'exercise-card';\n                card.dataset.ex = index;\n                \n                // Determine number of target sets\n                const setsRange = exercise.sets.split('-').map(Number);\n                const targetSets = setsRange[setsRange.length - 1];\n\n                // Last session's numbers for this exercise\n                const prev = findPrevious(exercise.exercise);\n                const nextIdx = exerciseData.loggedSets.length;\n                const seed = exerciseData.loggedSets.length\n                    ? exerciseData.loggedSets[exerciseData.loggedSets.length - 1]\n                    : (prev ? prev.sets[0] : null);\n                const preW = seed ? seed.weight : '';\n                const preR = seed ? seed.reps : '';\n                const prevHTML = prev\n                    ? `\u003cdiv class=\"prev-line\">Last time (${prev.label}): ${prev.sets.map(s => `\u003cstrong>${s.weight}\u003c/strong> kg × ${s.reps}`).join(' · ')}\u003c/div>`\n                    : `\u003cdiv class=\"prev-line\">No previous session for this exercise yet\u003c/div>`;\n                const hint = prev ? progressionHint(exercise, prev.sets) : null;\n                const hintHTML = hint ? `\u003cdiv class=\"hint hint-${hint.type}\">\u003cspan class=\"hint-icon\">${hint.icon}\u003c/span>\u003cspan>${hint.text}\u003c/span>\u003c/div>` : '';\n                const pn = findPreviousNote(exercise.exercise);\n                const prevNoteHTML = pn ? `\u003cdiv class=\"prev-note\">Note from ${pn.label}: ${escHTML(pn.text)}\u003c/div>` : '';\n\n                // Superset banner\n                const ssi = ssInfo(currentPlan, currentWeek)[index];\n                let ssHTML = '';\n                if (ssi) {\n                    const mine = exerciseData.loggedSets.length;\n                    const others = ssi.members.filter(k => k !== index);\n                    const names = others.map(k => escHTML(exercises[k].exercise));\n                    const ahead = others.filter(k => setCount(k) > mine);\n                    const behindK = others.filter(k => setCount(k) \u003c mine);\n                    if (ahead.length) {\n                        ssHTML = `\u003cdiv class=\"ss-banner turn\">\u003cspan>⛓\u003c/span>\u003cspan>${ssi.tag}: your turn, then rest\u003c/span>\u003c/div>`;\n                    } else if (behindK.length) {\n                        ssHTML = `\u003cdiv class=\"ss-banner\">\u003cspan>⛓\u003c/span>\u003cspan>${ssi.tag}: now do \u003cstrong>${escHTML(exercises[behindK[0]].exercise)}\u003c/strong>\u003c/span>\u003c/div>`;\n                    } else {\n                        ssHTML = `\u003cdiv class=\"ss-banner\">\u003cspan>⛓\u003c/span>\u003cspan>${ssi.tag}: back to back with ${names.join(' + ')}, then rest\u003c/span>\u003c/div>`;\n                    }\n                }\n                const lastSet = exerciseData.loggedSets[exerciseData.loggedSets.length - 1];\n                const repeatHTML = lastSet\n                    ? `\u003cbutton class=\"repeat-btn\" type=\"button\">↻ Repeat set ${exerciseData.loggedSets.length}: ${fmtNum(lastSet.weight)} kg × ${lastSet.reps}\u003c/button>` : '';\n                const links = getLinks(currentPlan);\n                const toggleHTML = index \u003c exercises.length - 1\n                    ? `\u003cbutton class=\"ss-toggle\" type=\"button\">⛓ Superset with next exercise: ${links[index] ? 'On' : 'Off'}\u003c/button>` : '';\n\n                let setsHTML = `\n                    \u003cdiv class=\"exercise-header\">\n                        \u003cdiv class=\"exercise-title\">\n                            \u003ch3>${escHTML(exercise.exercise)}\u003c/h3>\n                            \u003cdiv class=\"body-part\">${escHTML(exercise.bodyPart)}\u003c/div>\n                            \u003cdiv class=\"rep-range\">${escHTML(exercise.repRange)} reps\u003c/div>\n                            \u003cdiv class=\"rest-line\">\u003clabel for=\"rest-${index}\">Rest\u003c/label>\u003cselect id=\"rest-${index}\" class=\"rest-pick\" title=\"★ = recommended\">${restOptions(restFor(currentPlan, index), KIND[exercise.kind].rest)}\u003c/select>\u003c/div>\n                            ${exercise.video ? `\u003ca class=\"video-link\" href=\"${escHTML(exercise.video)}\" target=\"_blank\" rel=\"noopener\">▶ Watch video\u003c/a>` : `\u003ca class=\"video-link\" href=\"https://www.youtube.com/results?search_query=${encodeURIComponent(exercise.exercise + ' form')}\" target=\"_blank\" rel=\"noopener\">🔍 Find video\u003c/a>`}\n                        \u003c/div>\n                        \u003cdiv class=\"sets-info\">\n                            \u003cspan>${exercise.sets} sets\u003c/span>\n                        \u003c/div>\n                    \u003c/div>\n\n                    ${ssHTML}\n                    \u003cdiv class=\"sets-section\">\n                        \u003clabel class=\"sets-section-label\">Log Set\u003c/label>\n                        ${prevHTML}\n                        ${prevNoteHTML}\n                        ${hintHTML}\n                        \u003cdiv class=\"set-input-area\">\n                            \u003cdiv class=\"input-group\">\n                                \u003clabel>Weight\u003c/label>\n                                \u003cinput type=\"number\" inputmode=\"decimal\" class=\"set-weight-input\" placeholder=\"kg\" value=\"${preW}\" onfocus=\"this.select()\" data-key=\"${key}\">\n                            \u003c/div>\n                            \u003cdiv class=\"input-group\">\n                                \u003clabel>Reps\u003c/label>\n                                \u003cinput type=\"number\" inputmode=\"numeric\" class=\"set-reps-input\" placeholder=\"reps\" value=\"${preR}\" onfocus=\"this.select()\" data-key=\"${key}\">\n                            \u003c/div>\n                            \u003cbutton class=\"log-set-btn\" data-key=\"${key}\">Log\u003c/button>\n                        \u003c/div>\n                        ${repeatHTML}\n                `;\n\n                if (exerciseData.loggedSets && exerciseData.loggedSets.length > 0) {\n                    setsHTML += `\u003cdiv class=\"sets-log\">`;\n                    exerciseData.loggedSets.forEach((set, setIndex) => {\n                        if (editing && editing.key === key && editing.index === setIndex) {\n                            setsHTML += `\n                            \u003cdiv class=\"set-logged editing\">\n                                \u003cspan class=\"set-logged-number\">Set ${setIndex + 1}\u003c/span>\n                                \u003cinput type=\"number\" inputmode=\"decimal\" class=\"edit-weight\" value=\"${set.weight}\" aria-label=\"Weight in kg\">\n                                \u003cinput type=\"number\" inputmode=\"numeric\" class=\"edit-reps\" value=\"${set.reps}\" aria-label=\"Reps\">\n                                \u003cbutton class=\"set-save\" data-key=\"${key}\" data-index=\"${setIndex}\" aria-label=\"Save set\">✓\u003c/button>\n                                \u003cbutton class=\"set-cancel\" aria-label=\"Cancel edit\">✕\u003c/button>\n                            \u003c/div>`;\n                        } else {\n                            setsHTML += `\n                            \u003cdiv class=\"set-logged\">\n                                \u003cdiv class=\"set-logged-data\">\n                                    \u003cspan class=\"set-logged-number\">Set ${setIndex + 1}\u003c/span>\n                                    \u003cspan class=\"set-logged-value\">${set.weight} kg × ${set.reps}\u003c/span>\n                                \u003c/div>\n                                \u003cdiv class=\"set-logged-actions\">\n                                    \u003cbutton class=\"set-logged-edit\" data-key=\"${key}\" data-index=\"${setIndex}\" aria-label=\"Edit set ${setIndex + 1}\">✎\u003c/button>\n                                    \u003cbutton class=\"set-logged-delete\" data-key=\"${key}\" data-index=\"${setIndex}\" aria-label=\"Delete set ${setIndex + 1}\">✕\u003c/button>\n                                \u003c/div>\n                            \u003c/div>`;\n                        }\n                    });\n                    setsHTML += `\u003c/div>`;\n                }\n\n                setsHTML += `\n                    \u003c/div>\n\n                    \u003cdiv class=\"note-area\">\n                        \u003clabel class=\"sets-section-label\" for=\"note-${index}\">Note\u003c/label>\n                        \u003ctextarea id=\"note-${index}\" class=\"note-input\" rows=\"2\" maxlength=\"500\" placeholder=\"Add a note (e.g. left shoulder tight)\">\u003c/textarea>\n                        ${toggleHTML}\n                    \u003c/div>\n\n                    \u003cdiv class=\"stats\">\n                        \u003cdiv class=\"stat\">\n                            \u003cspan class=\"stat-label\">Total Volume\u003c/span>\n                            \u003cspan class=\"stat-value\">${calculateSetVolume(exerciseData)}\u003c/span>\n                        \u003c/div>\n                        \u003cdiv class=\"stat\">\n                            \u003cspan class=\"stat-label\">Sets Logged\u003c/span>\n                            \u003cspan class=\"stat-value completed-count\">${exerciseData.loggedSets.length}/${targetSets}\u003c/span>\n                        \u003c/div>\n                    \u003c/div>\n                `;\n\n                card.innerHTML = setsHTML;\n                card.appendChild(buildHistory(exercise.exercise));\n                card.querySelector('.rest-pick').addEventListener('change', (e) => {\n                    const sec = parseInt(e.target.value, 10);\n                    setExerciseRest(currentPlan, index, sec);\n                    showToast(`Rest set to ${restLabel(sec)}`);\n                });\n\n                // Log set button\n                card.querySelector('.log-set-btn').addEventListener('click', (e) => {\n                    const key = e.target.dataset.key;\n                    const weight = card.querySelector('.set-weight-input').value;\n                    const reps = card.querySelector('.set-reps-input').value;\n\n                    if (weight === '' || reps === '' || isNaN(parseFloat(weight)) || isNaN(parseFloat(reps))) {\n                        showToast('Enter weight and reps first');\n                        return;\n                    }\n                    {\n                        if (!data[key]) data[key] = { loggedSets: [] };\n                        if (!data[key].loggedSets) data[key].loggedSets = [];\n                        data[key].loggedSets.push({ weight: parseFloat(weight), reps: parseFloat(reps) });\n                        \n                        // Clear inputs\n                        card.querySelector('.set-weight-input').value = '';\n                        card.querySelector('.set-reps-input').value = '';\n                        \n                        saveData();\n                        afterSetLogged(index);\n                        renderExercises(); // Re-render to show new set\n                    }\n                });\n\n                card.querySelector('.set-reps-input').addEventListener('keydown', (e) => {\n                    if (e.key === 'Enter') card.querySelector('.log-set-btn').click();\n                });\n\n                // Repeat last set\n                const rb = card.querySelector('.repeat-btn');\n                if (rb) rb.addEventListener('click', () => {\n                    const sets = data[key] && data[key].loggedSets;\n                    if (!sets || !sets.length) return;\n                    const last = sets[sets.length - 1];\n                    sets.push({ weight: last.weight, reps: last.reps });\n                    saveData();\n                    afterSetLogged(index);\n                    renderExercises();\n                });\n\n                // Notes (saved as you type)\n                const ta = card.querySelector('.note-input');\n                ta.value = exerciseData.note || '';\n                ta.addEventListener('input', () => {\n                    if (!data[key]) data[key] = { loggedSets: [] };\n                    if (!data[key].loggedSets) data[key].loggedSets = [];\n                    if (ta.value.trim()) data[key].note = ta.value; else delete data[key].note;\n                    saveData();\n                });\n\n                // Superset link with next exercise\n                const tg = card.querySelector('.ss-toggle');\n                if (tg) tg.addEventListener('click', () => {\n                    const next = { ...getLinks(currentPlan) };\n                    if (next[index]) delete next[index]; else next[index] = true;\n                    data._supersets = { ...(data._supersets || {}), [currentPlan]: next };\n                    saveData();\n                    renderExercises();\n                });\n\n                card.querySelectorAll('.set-logged-edit').forEach(btn => {\n                    btn.addEventListener('click', () => {\n                        editing = { key: btn.dataset.key, index: parseInt(btn.dataset.index) };\n                        renderExercises();\n                    });\n                });\n                card.querySelectorAll('.set-cancel').forEach(btn => {\n                    btn.addEventListener('click', () => { editing = null; renderExercises(); });\n                });\n                card.querySelectorAll('.set-save').forEach(btn => {\n                    btn.addEventListener('click', () => {\n                        const row = btn.closest('.set-logged');\n                        const w = parseFloat(row.querySelector('.edit-weight').value);\n                        const r = parseFloat(row.querySelector('.edit-reps').value);\n                        if (isNaN(w) || isNaN(r) || w \u003c 0 || r \u003c= 0) { showToast('Enter weight and reps'); return; }\n                        const k = btn.dataset.key, i = parseInt(btn.dataset.index);\n                        if (data[k] && data[k].loggedSets && data[k].loggedSets[i]) {\n                            data[k].loggedSets[i] = { weight: w, reps: r };\n                            saveData();\n                        }\n                        editing = null;\n                        renderExercises();\n                    });\n                });\n\n                // Delete set button\n                card.querySelectorAll('.set-logged-delete').forEach(btn => {\n                    btn.addEventListener('click', (e) => {\n                        const key = e.target.dataset.key;\n                        const index = parseInt(e.target.dataset.index);\n                        \n                        if (data[key] && data[key].loggedSets) {\n                            data[key].loggedSets.splice(index, 1);\n                            editing = null;\n                            saveData();\n                            renderExercises();\n                        }\n                    });\n                });\n\n                container.appendChild(card);\n            });\n\n            container.appendChild(buildSessionCard('cooldown'));\n\n            if (pendingFocus !== null) {\n                const pc = container.querySelector(`[data-ex=\"${pendingFocus}\"]`);\n                pendingFocus = null;\n                if (pc) {\n                    if (pc.scrollIntoView) pc.scrollIntoView({ block: 'center', behavior: 'smooth' });\n                    const inp = pc.querySelector('.set-weight-input');\n                    if (inp) inp.focus({ preventScroll: true });\n                }\n            }\n        }\n\n        let warmupType = 'walk';\n\n        function sessionKey(kind) {\n            return `${currentPlan}_${currentWeek}_${currentDay}_${kind}`;\n        }\n\n        function describeEntry(e) {\n            if (e.type === 'dumbbell') return { label: `${e.weight || 1} kg dumbbell set`, detail: `${e.reps} reps` };\n            return { label: 'Treadmill walk', detail: `${e.minutes} min, ${e.incline}% incline, ${e.speed} km/h` };\n        }\n\n        function sessionFieldsHTML(type) {\n            if (type === 'dumbbell') {\n                return `\u003cdiv class=\"session-fields one\">\n                    \u003cdiv class=\"input-group\">\u003clabel>Reps\u003c/label>\u003cinput type=\"number\" inputmode=\"numeric\" class=\"f-reps\" placeholder=\"reps\" min=\"0\">\u003c/div>\n                \u003c/div>`;\n            }\n            return `\u003cdiv class=\"session-fields\">\n                \u003cdiv class=\"input-group\">\u003clabel>Minutes\u003c/label>\u003cinput type=\"number\" inputmode=\"decimal\" class=\"f-minutes\" placeholder=\"min\" min=\"0\" step=\"any\">\u003c/div>\n                \u003cdiv class=\"input-group\">\u003clabel>Incline %\u003c/label>\u003cinput type=\"number\" inputmode=\"decimal\" class=\"f-incline\" placeholder=\"%\" min=\"0\" step=\"any\">\u003c/div>\n                \u003cdiv class=\"input-group\">\u003clabel>Speed km/h\u003c/label>\u003cinput type=\"number\" inputmode=\"decimal\" class=\"f-speed\" placeholder=\"km/h\" min=\"0\" step=\"any\">\u003c/div>\n            \u003c/div>`;\n        }\n\n        function buildSessionCard(kind) {\n            const isWarm = kind === 'warmup';\n            const title = isWarm ? 'Warm-up' : 'Cool-down';\n            const key = sessionKey(kind);\n            const entries = Array.isArray(data[key]) ? data[key] : [];\n            const card = document.createElement('div');\n            card.className = 'exercise-card session-card';\n            card.innerHTML = `\n                \u003cdiv class=\"exercise-header\">\u003cdiv class=\"exercise-title\">\n                    \u003ch3>${title}\u003c/h3>\n                    \u003cdiv class=\"body-part\">${isWarm ? 'Optional · add as many as you need' : 'Optional · treadmill walk'}\u003c/div>\n                \u003c/div>\u003c/div>\n                ${isWarm ? `\u003cdiv class=\"input-group session-type\">\u003clabel>Type\u003c/label>\u003cselect class=\"f-type\">\u003coption value=\"walk\">Treadmill walk\u003c/option>\u003coption value=\"dumbbell\">1 kg dumbbell set\u003c/option>\u003c/select>\u003c/div>` : ''}\n                \u003cdiv class=\"session-fields-wrap\">\u003c/div>\n                \u003cbutton class=\"log-set-btn session-add\">Add ${title.toLowerCase()}\u003c/button>\n                ${entries.length ? `\u003cdiv class=\"sets-log session-list\">${entries.map((e, i) => {\n                    const d = describeEntry(e);\n                    return `\u003cdiv class=\"set-logged\">\u003cdiv class=\"set-logged-data\">\u003cspan class=\"session-entry-label\">${d.label}\u003c/span>\u003cspan class=\"set-logged-value\">${d.detail}\u003c/span>\u003c/div>\u003cbutton class=\"set-logged-delete\" data-index=\"${i}\">✕\u003c/button>\u003c/div>`;\n                }).join('')}\u003c/div>` : ''}`;\n\n            const wrap = card.querySelector('.session-fields-wrap');\n            const typeSel = card.querySelector('.f-type');\n            const curType = () => isWarm ? warmupType : 'walk';\n            wrap.innerHTML = sessionFieldsHTML(curType());\n            if (typeSel) {\n                typeSel.value = warmupType;\n                typeSel.addEventListener('change', () => {\n                    warmupType = typeSel.value;\n                    wrap.innerHTML = sessionFieldsHTML(warmupType);\n                });\n            }\n\n            card.querySelector('.session-add').addEventListener('click', () => {\n                const num = sel => { const el = wrap.querySelector(sel); return el ? parseFloat(el.value) : NaN; };\n                let entry;\n                if (curType() === 'dumbbell') {\n                    const reps = num('.f-reps');\n                    if (!(reps > 0)) { showToast('Enter the reps'); return; }\n                    entry = { type: 'dumbbell', weight: 1, reps };\n                } else {\n                    const minutes = num('.f-minutes'), speed = num('.f-speed'), incline = num('.f-incline');\n                    if (!(minutes > 0) || !(speed > 0)) { showToast('Enter minutes and speed'); return; }\n                    entry = { type: 'walk', minutes, incline: isNaN(incline) ? 0 : incline, speed };\n                }\n                if (!Array.isArray(data[key])) data[key] = [];\n                data[key].push(entry);\n                saveData();\n                renderExercises();\n            });\n\n            card.querySelectorAll('.set-logged-delete').forEach(btn => {\n                btn.addEventListener('click', () => {\n                    data[key].splice(parseInt(btn.dataset.index), 1);\n                    if (!data[key].length) delete data[key];\n                    saveData();\n                    renderExercises();\n                });\n            });\n\n            return card;\n        }\n\n        function calculateSetVolume(exerciseData) {\n            if (!exerciseData.loggedSets || exerciseData.loggedSets.length === 0) return '—';\n            \n            let totalVolume = 0;\n            exerciseData.loggedSets.forEach(set => {\n                totalVolume += (set.weight * set.reps);\n            });\n            \n            return totalVolume > 0 ? `${totalVolume} kg` : '—';\n        }\n\n        function exportData() {\n            const json = JSON.stringify(data, null, 2);\n            const blob = new Blob([json], { type: 'application/json' });\n            const url = URL.createObjectURL(blob);\n            const a = document.createElement('a');\n            a.href = url;\n            a.download = `training-tracker-${new Date().toISOString().split('T')[0]}.json`;\n            a.click();\n            URL.revokeObjectURL(url);\n            showToast('Data exported');\n            lsSet(LAST_KEY, String(Date.now()));\n            updateBackupUI();\n        }\n\n        function importData() {\n            document.getElementById('fileInput').click();\n        }\n\n        async function clearData() {\n            if (await askConfirm('Clear all training data and your own programs? This cannot be undone.', 'Clear all', true)) {\n                await backupNow(); // keep a restorable copy of what is about to be cleared\n                data = {};\n                currentPlan = 'gym';\n                rebuildPlans();\n                lsSet(STORAGE_KEY, '{}');\n                renderExercises();\n                showToast('Data cleared. Automatic copies can still be restored under Backup.');\n            }\n        }\n\n        function showToast(message) {\n            const toast = document.createElement('div');\n            toast.className = 'toast';\n            toast.textContent = message;\n            document.body.appendChild(toast);\n            setTimeout(() => toast.remove(), 2000);\n        }\n\n        document.getElementById('fileInput').addEventListener('change', (e) => {\n            const file = e.target.files[0];\n            if (!file) return;\n\n            const reader = new FileReader();\n            reader.onload = (event) => {\n                try {\n                    const imported = JSON.parse(event.target.result);\n                    data = { ...data, ...imported };\n                    rebuildPlans();\n                    saveData();\n                    renderExercises();\n                    showToast('Data imported');\n                } catch (error) {\n                    showToast('Failed to import data');\n                }\n            };\n            reader.readAsText(file);\n        });\n\n        const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n\n        function toISO(d) {\n            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;\n        }\n\n        function mondayOf(d) {\n            const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());\n            x.setDate(x.getDate() - ((x.getDay() + 6) % 7));\n            return x;\n        }\n\n        function getStartDate() {\n            const m = /^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(data._startDate || '');\n            if (m) return new Date(+m[1], +m[2] - 1, +m[3]);\n            const d = mondayOf(new Date());\n            data._startDate = toISO(d);\n            saveData();\n            return d;\n        }\n\n        function weekRange(week) {\n            const s = getStartDate();\n            const a = new Date(s.getFullYear(), s.getMonth(), s.getDate() + (week - 1) * 7);\n            const b = new Date(a.getFullYear(), a.getMonth(), a.getDate() + 6);\n            return { a, b };\n        }\n\n        function weekRangeText(week, sep) {\n            const { a, b } = weekRange(week);\n            const f = d => `${d.getDate()} ${MONTHS[d.getMonth()]}`;\n            return `${f(a)} ${sep} ${f(b)} ${b.getFullYear()}`;\n        }\n\n        function updateWeekPicker() {\n            document.getElementById('weekTitle').textContent = `Week ${currentWeek} of 16`;\n            document.getElementById('weekDates').textContent = weekRangeText(currentWeek, '\\u2013');\n            document.getElementById('weekPrev').disabled = currentWeek \u003c= 1;\n            document.getElementById('weekNext').disabled = currentWeek >= 16;\n        }\n\n        function setWeek(w) {\n            currentWeek = Math.max(1, Math.min(16, w));\n            editing = null;\n            renderExercises();\n        }\n\n        document.getElementById('weekPrev').addEventListener('click', () => setWeek(currentWeek - 1));\n        document.getElementById('weekNext').addEventListener('click', () => setWeek(currentWeek + 1));\n        document.getElementById('startDate').addEventListener('change', (e) => {\n            if (!e.target.value) return;\n            const [y, m, d] = e.target.value.split('-').map(Number);\n            data._startDate = toISO(mondayOf(new Date(y, m - 1, d)));\n            saveData();\n            e.target.value = data._startDate;\n            renderExercises();\n        });\n\n        let editing = null;\n\n        function findPrevious(name) {\n            const ids = DAYS.map(d => d[0]);\n            const curPos = (currentWeek - 1) * 7 + ids.indexOf(currentDay);\n            const order = planOrder();\n            for (let pos = curPos - 1; pos >= 0; pos--) {\n                const w = Math.floor(pos / 7) + 1, di = pos % 7, id = ids[di];\n                for (const plan of order) {\n                    const list = PLANS[plan][w] || [];\n                    const i = list.findIndex(e => e.exercise === name);\n                    if (i \u003c 0) continue;\n                    const d = data[`${plan}_${w}_${id}_${i}`];\n                    if (d && d.loggedSets && d.loggedSets.length) {\n                        const dt = weekRange(w).a;\n                        dt.setDate(dt.getDate() + di);\n                        const label = `${DAYS[di][1]} ${dt.getDate()} ${MONTHS[dt.getMonth()]}${plan !== currentPlan ? ', ' + planName(plan) : ''}`;\n                        return { sets: d.loggedSets, label };\n                    }\n                }\n            }\n            return null;\n        }\n\n        /* ---------- Supersets, notes, repeat ---------- */\n        const DEFAULT_LINKS = { home: { 0: true }, gym: { 0: true } };\n        let pendingFocus = null;\n\n        const escHTML = s => String(s).replace(/[&\u003c>\"']/g, c => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n\n        function wrapText(s, n) {\n            const out = [];\n            String(s).split(/\\r?\\n/).forEach(line => {\n                let cur = '';\n                line.split(/\\s+/).filter(Boolean).forEach(word => {\n                    while (word.length > n) { if (cur) { out.push(cur); cur = ''; } out.push(word.slice(0, n)); word = word.slice(n); }\n                    if ((cur + ' ' + word).trim().length > n) { out.push(cur); cur = word; }\n                    else cur = (cur + ' ' + word).trim();\n                });\n                out.push(cur);\n            });\n            return out.filter(l => l);\n        }\n\n        function getLinks(plan) {\n            const s = data._supersets;\n            return (s && s[plan]) ? s[plan] : (DEFAULT_LINKS[plan] || {});\n        }\n\n        function ssInfo(plan, week) {\n            const list = PLANS[plan][week] || [];\n            const links = getLinks(plan);\n            const out = Array(list.length).fill(null);\n            let i = 0, gi = 0;\n            while (i \u003c list.length) {\n                let j = i;\n                while (j \u003c list.length - 1 && links[j]) j++;\n                if (j > i) {\n                    const id = String.fromCharCode(65 + gi++);\n                    const members = [];\n                    for (let k = i; k \u003c= j; k++) members.push(k);\n                    members.forEach((k, pos) => { out[k] = { id, pos, members, tag: `Superset ${id}${pos + 1}` }; });\n                }\n                i = j + 1;\n            }\n            return out;\n        }\n\n        function setCount(index) {\n            const d = data[getExerciseKey(currentWeek, index)];\n            return d && d.loggedSets ? d.loggedSets.length : 0;\n        }\n\n        function afterSetLogged(index) {\n            const info = ssInfo(currentPlan, currentWeek)[index];\n            pendingFocus = null;\n            if (!info) { startRest(restFor(currentPlan, index)); return; }\n            const mine = setCount(index);\n            const behind = info.members.filter(k => k !== index && setCount(k) \u003c mine)\n                .sort((a, b) => ((a > index ? 0 : 1) - (b > index ? 0 : 1)) || a - b);\n            if (behind.length) {\n                pendingFocus = behind[0];\n                showToast(`Superset: now ${PLANS[currentPlan][currentWeek][behind[0]].exercise}`);\n            } else {\n                startRest(Math.max(...info.members.map(k => restFor(currentPlan, k))));\n            }\n        }\n\n        function findPreviousNote(name) {\n            const ids = DAYS.map(d => d[0]);\n            const curPos = (currentWeek - 1) * 7 + ids.indexOf(currentDay);\n            const order = planOrder();\n            for (let pos = curPos - 1; pos >= 0; pos--) {\n                const w = Math.floor(pos / 7) + 1, di = pos % 7, id = ids[di];\n                for (const plan of order) {\n                    const i = (PLANS[plan][w] || []).findIndex(e => e.exercise === name);\n                    if (i \u003c 0) continue;\n                    const d = data[`${plan}_${w}_${id}_${i}`];\n                    if (d && d.note) {\n                        const dt = weekRange(w).a;\n                        dt.setDate(dt.getDate() + di);\n                        return { text: d.note, label: `${DAYS[di][1]} ${dt.getDate()} ${MONTHS[dt.getMonth()]}` };\n                    }\n                }\n            }\n            return null;\n        }\n\n        /* ---------- History, progression hints, week on week ---------- */\n        const E1 = (w, r) => w * (1 + r / 30);\n        const fmtNum = n => String(Math.round(n * 100) / 100);\n\n        function sessionStats(sets) {\n            let topW = 0, vol = 0, e1 = 0, topR = 0;\n            sets.forEach(s => {\n                topW = Math.max(topW, s.weight);\n                vol += s.weight * s.reps;\n                e1 = Math.max(e1, E1(s.weight, s.reps));\n            });\n            sets.forEach(s => { if (s.weight === topW) topR = Math.max(topR, s.reps); });\n            return { topW, topR, vol, e1 };\n        }\n\n        function exerciseSessions(name) {\n            const ids = DAYS.map(d => d[0]);\n            const out = [];\n            for (let pos = 0; pos \u003c 16 * 7; pos++) {\n                const w = Math.floor(pos / 7) + 1, di = pos % 7, id = ids[di];\n                planIds().forEach(plan => {\n                    const list = PLANS[plan][w] || [];\n                    const i = list.findIndex(e => e.exercise === name);\n                    if (i \u003c 0) return;\n                    const d = data[`${plan}_${w}_${id}_${i}`];\n                    if (d && d.loggedSets && d.loggedSets.length) {\n                        const dt = weekRange(w).a;\n                        dt.setDate(dt.getDate() + di);\n                        out.push(Object.assign({\n                            pos, w, di, plan, sets: d.loggedSets,\n                            label: `${DAYS[di][1]} ${dt.getDate()} ${MONTHS[dt.getMonth()]}`\n                        }, sessionStats(d.loggedSets)));\n                    }\n                });\n            }\n            let best = 0;\n            out.forEach((s, i) => { s.pb = i > 0 && s.e1 > best + 1e-9; best = Math.max(best, s.e1); });\n            return out;\n        }\n\n        function progressionHint(exercise, prevSets) {\n            const m = /^(\\d+)\\s*-\\s*(\\d+)$/.exec(exercise.repRange || '');\n            if (!m || !prevSets || !prevSets.length) return null;\n            const lo = +m[1], hi = +m[2];\n            const minSets = Math.max(1, parseInt(exercise.sets) || 1);\n            const st = sessionStats(prevSets);\n            const top = prevSets.filter(s => s.weight === st.topW);\n            const minR = Math.min(...top.map(s => s.reps));\n            const wl = st.topW === 0 ? 'bodyweight' : `${fmtNum(st.topW)} kg`;\n            const inc = st.topW >= 40 ? 5 : st.topW >= 15 ? 2.5 : 1;\n            if (minR >= hi) {\n                if (top.length >= minSets) {\n                    return { type: 'up', icon: '▲', text: `You hit ${hi} reps on every set at ${wl}. ` + (st.topW === 0 ? 'Time to add some weight.' : `Try about ${fmtNum(st.topW + inc)} kg today.`) };\n                }\n                return { type: 'hold', icon: '→', text: `You hit ${hi} reps but logged ${top.length} of ${minSets} sets at ${wl}. Complete ${minSets} sets before going up.` };\n            }\n            if (top.every(s => s.reps \u003c lo)) {\n                return { type: 'down', icon: '▼', text: `Under ${lo} reps at ${wl}. Hold or drop the weight a little until you reach ${lo}.` };\n            }\n            return { type: 'hold', icon: '→', text: `Stay at ${wl} and aim for ${Math.min(hi, minR + 1)}+ reps on every set (your lowest was ${minR}).` };\n        }\n\n        const openHistory = new Set();\n\n        function niceScale(min, max) {\n            let range = max - min;\n            if (range \u003c= 0) range = Math.max(Math.abs(max) * 0.2, 1);\n            const raw = range / 3;\n            const step = [1, 2.5, 5, 10, 20, 25, 50, 100].find(s => s >= raw) || 100;\n            let lo = Math.floor(min / step) * step;\n            let hi = Math.ceil(max / step) * step;\n            if (hi === lo) { lo = Math.max(0, lo - step); hi = hi + step; }\n            const ticks = [];\n            for (let v = lo; v \u003c= hi + 1e-9; v += step) ticks.push(Math.round(v * 100) / 100);\n            return { lo, hi, ticks };\n        }\n\n        function buildHistoryChart(ss) {\n            const W = 300, H = 130, L = 34, R = 34, T = 20, B = 24;\n            const pw = W - L - R, ph = H - T - B, n = ss.length;\n            const sc = niceScale(Math.min(...ss.map(s => s.topW)), Math.max(...ss.map(s => s.topW)));\n            const X = i => L + i * pw / (n - 1);\n            const Y = v => T + ph - (v - sc.lo) / (sc.hi - sc.lo) * ph;\n            const pts = ss.map((s, i) => `${X(i).toFixed(1)},${Y(s.topW).toFixed(1)}`).join(' ');\n            const short = s => s.label.replace(/^\\w+ /, '');\n            let svg = `\u003csvg viewBox=\"0 0 ${W} ${H}\" role=\"img\" tabindex=\"0\" aria-label=\"Top set weight per session, from ${fmtNum(ss[0].topW)} kg to ${fmtNum(ss[n - 1].topW)} kg over ${n} sessions\">`;\n            sc.ticks.forEach(v => {\n                svg += `\u003cline class=\"hist-grid\" x1=\"${L}\" x2=\"${W - R}\" y1=\"${Y(v).toFixed(1)}\" y2=\"${Y(v).toFixed(1)}\"/>`;\n                svg += `\u003ctext class=\"hist-axis\" x=\"${L - 6}\" y=\"${(Y(v) + 3).toFixed(1)}\" text-anchor=\"end\">${fmtNum(v)}\u003c/text>`;\n            });\n            svg += `\u003ctext class=\"hist-axis\" x=\"${L}\" y=\"${H - 6}\" text-anchor=\"start\">${short(ss[0])}\u003c/text>`;\n            svg += `\u003ctext class=\"hist-axis\" x=\"${W - R}\" y=\"${H - 6}\" text-anchor=\"end\">${short(ss[n - 1])}\u003c/text>`;\n            svg += `\u003cpolyline class=\"hist-line\" points=\"${pts}\"/>`;\n            ss.forEach((s, i) => {\n                svg += `\u003ccircle class=\"hist-dot${s.pb ? ' pb' : ''}\" cx=\"${X(i).toFixed(1)}\" cy=\"${Y(s.topW).toFixed(1)}\" r=\"4\"/>`;\n                if (s.pb) svg += `\u003ctext class=\"hist-pb\" x=\"${X(i).toFixed(1)}\" y=\"${(Y(s.topW) - 9).toFixed(1)}\" text-anchor=\"middle\">PB\u003c/text>`;\n            });\n            svg += `\u003ctext class=\"hist-val\" x=\"${(X(n - 1) + 9).toFixed(1)}\" y=\"${(Y(ss[n - 1].topW) + 3).toFixed(1)}\">${fmtNum(ss[n - 1].topW)}\u003c/text>`;\n            svg += `\u003cline class=\"hist-cross\" x1=\"0\" x2=\"0\" y1=\"${T - 4}\" y2=\"${T + ph}\" style=\"display:none\"/>`;\n            svg += `\u003ccircle class=\"hist-hover\" r=\"6\" cx=\"0\" cy=\"0\" style=\"display:none\"/>`;\n            svg += `\u003c/svg>\u003cdiv class=\"hist-tip\" style=\"display:none\">\u003c/div>`;\n\n            const wrap = document.createElement('div');\n            wrap.className = 'hist-chart';\n            wrap.innerHTML = svg;\n            const el = wrap.querySelector('svg'), cross = wrap.querySelector('.hist-cross'),\n                  ring = wrap.querySelector('.hist-hover'), tip = wrap.querySelector('.hist-tip');\n            let cur = n - 1;\n\n            const show = i => {\n                cur = Math.max(0, Math.min(n - 1, i));\n                const s = ss[cur], x = X(cur), y = Y(s.topW);\n                cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.style.display = '';\n                ring.setAttribute('cx', x); ring.setAttribute('cy', y); ring.style.display = '';\n                tip.textContent = '';\n                const strong = document.createElement('strong');\n                strong.textContent = `${fmtNum(s.topW)} kg × ${s.topR}${s.pb ? '  PB' : ''}`;\n                tip.appendChild(strong);\n                tip.appendChild(document.createTextNode(`${s.label} · ${Math.round(s.vol)} kg volume`));\n                tip.style.display = '';\n                const box = el.getBoundingClientRect();\n                const px = x / W * box.width;\n                tip.style.left = Math.min(Math.max(px, 80), Math.max(box.width - 80, 80)) + 'px';\n            };\n            const hide = () => { cross.style.display = 'none'; ring.style.display = 'none'; tip.style.display = 'none'; };\n            const fromEvent = e => {\n                const box = el.getBoundingClientRect();\n                const rel = (e.clientX - box.left) / box.width * W;\n                show(Math.round((rel - L) / pw * (n - 1)));\n            };\n            el.addEventListener('pointerdown', fromEvent);\n            el.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) fromEvent(e); });\n            el.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });\n            el.addEventListener('focus', () => show(cur));\n            el.addEventListener('blur', hide);\n            el.addEventListener('keydown', e => {\n                if (e.key === 'ArrowLeft') { show(cur - 1); e.preventDefault(); }\n                else if (e.key === 'ArrowRight') { show(cur + 1); e.preventDefault(); }\n                else if (e.key === 'Escape') hide();\n            });\n            return wrap;\n        }\n\n        function buildHistory(name) {\n            const ss = exerciseSessions(name);\n            const det = document.createElement('details');\n            det.className = 'history';\n            if (openHistory.has(name)) det.open = true;\n            det.addEventListener('toggle', () => { if (det.open) openHistory.add(name); else openHistory.delete(name); });\n            const sum = document.createElement('summary');\n            sum.textContent = ss.length ? `History · ${ss.length} session${ss.length === 1 ? '' : 's'}` : 'History';\n            det.appendChild(sum);\n            const body = document.createElement('div');\n            body.className = 'history-body';\n            det.appendChild(body);\n            if (!ss.length) {\n                body.textContent = 'Your history appears here after your first logged session.';\n                return det;\n            }\n            const bestS = ss.reduce((a, b) => (b.e1 > a.e1 ? b : a));\n            const bestSet = bestS.sets.reduce((a, s) => (E1(s.weight, s.reps) > E1(a.weight, a.reps) ? s : a));\n            const best = document.createElement('div');\n            best.className = 'hist-best';\n            best.textContent = `Best set: ${fmtNum(bestSet.weight)} kg × ${bestSet.reps} (${bestS.label})`;\n            body.appendChild(best);\n            if (ss.length >= 2) {\n                body.appendChild(buildHistoryChart(ss));\n            } else {\n                const note = document.createElement('div');\n                note.className = 'hist-note';\n                note.textContent = 'Log another session to see the trend.';\n                body.appendChild(note);\n            }\n            const recent = ss.slice(-12).reverse();\n            let rows = recent.map(s => `\u003ctr>\u003ctd>${s.label}\u003c/td>\u003ctd>${fmtNum(s.topW)} kg × ${s.topR}\u003c/td>\u003ctd>${Math.round(s.vol)} kg\u003c/td>\u003ctd class=\"pbcell\">${s.pb ? 'PB' : ''}\u003c/td>\u003c/tr>`).join('');\n            const tbl = document.createElement('div');\n            tbl.innerHTML = `\u003ctable class=\"hist-table\">\u003cthead>\u003ctr>\u003cth>Date\u003c/th>\u003cth>Top set\u003c/th>\u003cth>Volume\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${rows}\u003c/tbody>\u003c/table>`;\n            body.appendChild(tbl);\n            const foot = document.createElement('div');\n            foot.className = 'hist-note';\n            foot.textContent = (ss.length > 12 ? `Showing latest 12 of ${ss.length} sessions. ` : '') + 'PB = best set so far, counting weight and reps together.';\n            body.appendChild(foot);\n            return det;\n        }\n\n        function weekExerciseStats(week) {\n            const map = new Map();\n            DAYS.forEach(([id]) => planIds().forEach(plan => {\n                (PLANS[plan][week] || []).forEach((ex, i) => {\n                    const d = data[`${plan}_${week}_${id}_${i}`];\n                    if (!d || !d.loggedSets || !d.loggedSets.length) return;\n                    const m = map.get(ex.exercise) || { name: ex.exercise, sets: [] };\n                    m.sets = m.sets.concat(d.loggedSets);\n                    map.set(ex.exercise, m);\n                });\n            }));\n            map.forEach(m => Object.assign(m, sessionStats(m.sets)));\n            return map;\n        }\n\n        function weekOnWeek(week) {\n            const cur = weekExerciseStats(week);\n            const prev = week > 1 ? weekExerciseStats(week - 1) : new Map();\n            const rows = [];\n            cur.forEach(c => {\n                const p = prev.get(c.name) || null;\n                let delta = null;\n                if (p) {\n                    const parts = []; let dir = 0;\n                    if (c.topW !== p.topW) {\n                        const d = c.topW - p.topW;\n                        parts.push(`${d > 0 ? '+' : '-'}${fmtNum(Math.abs(d))} kg top set`);\n                        dir = d > 0 ? 1 : -1;\n                    } else if (c.topR !== p.topR) {\n                        const d = c.topR - p.topR;\n                        parts.push(`${d > 0 ? '+' : '-'}${Math.abs(d)} reps at top weight`);\n                        dir = d > 0 ? 1 : -1;\n                    } else {\n                        parts.push('top set unchanged');\n                    }\n                    if (p.vol > 0) {\n                        const pct = Math.round((c.vol - p.vol) / p.vol * 100);\n                        parts.push(`${pct >= 0 ? '+' : '-'}${Math.abs(pct)}% volume`);\n                        if (!dir) dir = pct > 0 ? 1 : pct \u003c 0 ? -1 : 0;\n                    }\n                    delta = { text: parts.join(' · '), dir };\n                }\n                rows.push({ c, p, delta });\n            });\n            return rows;\n        }\n\n        /* ---------- Rest timer ---------- */\n        const rest = { end: 0, iv: null, hideTimer: null, ctx: null, lock: null, done: false };\n\n        function restOn() {\n            return data._restSeconds !== 0;\n        }\n\n        function audioCtx() {\n            try {\n                if (!rest.ctx) {\n                    const C = window.AudioContext || window.webkitAudioContext;\n                    if (C) rest.ctx = new C();\n                }\n                if (rest.ctx && rest.ctx.state === 'suspended') rest.ctx.resume();\n            } catch (e) {}\n            return rest.ctx;\n        }\n\n        function beep() {\n            const ctx = audioCtx();\n            if (!ctx) return;\n            [0, 0.25, 0.5].forEach((t, i) => {\n                const o = ctx.createOscillator(), g = ctx.createGain();\n                o.frequency.value = i === 2 ? 1175 : 880;\n                g.gain.value = 0.25;\n                o.connect(g); g.connect(ctx.destination);\n                o.start(ctx.currentTime + t);\n                o.stop(ctx.currentTime + t + 0.15);\n            });\n        }\n\n        async function holdScreen(on) {\n            try {\n                if (on && 'wakeLock' in navigator && !rest.lock) {\n                    rest.lock = await navigator.wakeLock.request('screen');\n                    rest.lock.addEventListener('release', () => { rest.lock = null; });\n                } else if (!on && rest.lock) {\n                    await rest.lock.release();\n                    rest.lock = null;\n                }\n            } catch (e) {}\n        }\n\n        function fmtClock(s) {\n            return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;\n        }\n\n        function hideRest() {\n            clearInterval(rest.iv); clearTimeout(rest.hideTimer);\n            rest.iv = null; rest.hideTimer = null; rest.done = false;\n            document.getElementById('restBar').classList.add('hidden');\n            document.body.classList.remove('rest-active');\n            holdScreen(false);\n        }\n\n        function startRest(s) {\n            if (!restOn() || !s) return;\n            audioCtx(); // unlock sound while we are inside a tap\n            rest.end = Date.now() + s * 1000;\n            runRest();\n        }\n\n        function runRest() {\n            clearInterval(rest.iv); clearTimeout(rest.hideTimer);\n            rest.done = false;\n            const bar = document.getElementById('restBar');\n            bar.classList.remove('hidden', 'done');\n            document.body.classList.add('rest-active');\n            document.getElementById('restLabel').textContent = 'Rest';\n            document.getElementById('restSkip').textContent = 'Skip';\n            rest.iv = setInterval(tickRest, 250);\n            holdScreen(true);\n            tickRest();\n        }\n\n        function tickRest() {\n            const ms = rest.end - Date.now();\n            const left = Math.ceil(ms / 1000);\n            if (left > 0) {\n                document.getElementById('restTime').textContent = fmtClock(left);\n                return;\n            }\n            if (-ms > 30000) { hideRest(); return; } // returned long after it finished\n            if (rest.done) return;\n            rest.done = true;\n            clearInterval(rest.iv); rest.iv = null;\n            document.getElementById('restTime').textContent = '0:00';\n            document.getElementById('restBar').classList.add('done');\n            document.getElementById('restLabel').textContent = 'Rest over, go!';\n            document.getElementById('restSkip').textContent = 'Dismiss';\n            beep();\n            try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (
