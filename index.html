e) {}\n            holdScreen(false);\n            rest.hideTimer = setTimeout(hideRest, 20000);\n        }\n\n        document.getElementById('restSkip').addEventListener('click', hideRest);\n        document.getElementById('restPlus').addEventListener('click', () => {\n            rest.end = Math.max(rest.end, Date.now()) + 15000;\n            runRest();\n        });\n        document.getElementById('restMinus').addEventListener('click', () => {\n            if (rest.done) return;\n            rest.end -= 15000;\n            tickRest();\n        });\n        document.getElementById('restSelect').addEventListener('change', (e) => {\n            data._restSeconds = e.target.value === '0' ? 0 : -1;\n            saveData();\n        });\n        document.addEventListener('visibilitychange', () => {\n            if (!document.hidden && !document.getElementById('restBar').classList.contains('hidden') && !rest.done) {\n                tickRest();\n                if (!rest.done && !rest.iv) rest.iv = setInterval(tickRest, 250);\n                if (!rest.lock) holdScreen(true);\n            }\n        });\n\n        function renderExercises() {\n            updateWeekPicker();\n            const isHome = view === 'home', isLog = view === 'log', isReport = view === 'report', isEditor = view === 'editor';\n            document.getElementById('homeView').classList.toggle('hidden', !isHome);\n            document.getElementById('logView').classList.toggle('hidden', !isLog);\n            document.getElementById('reportView').classList.toggle('hidden', !isReport);\n            document.getElementById('editorView').classList.toggle('hidden', !isEditor);\n            document.getElementById('backBtn').classList.toggle('hidden', isHome);\n            document.getElementById('weekBlock').classList.toggle('hidden', isHome || isEditor);\n            document.getElementById('daySelector').classList.toggle('hidden', !isLog);\n            document.getElementById('viewTitle').textContent =\n                isHome ? 'Training Tracker' : isReport ? 'Weekly report'\n                : isEditor ? (ed && ed.baseId ? 'Edit program' : 'New program')\n                : planTitle(currentPlan);\n            document.title = isReport ? `Training report - Week ${currentWeek}` : 'Training Tracker';\n            document.getElementById('restSelect').value = restOn() ? 'auto' : '0';\n            if (isHome) {\n                renderHome();\n            } else if (isLog) {\n                renderDays();\n                renderLog();\n            } else if (isEditor) {\n                renderEditor();\n            } else {\n                renderReport();\n            }\n        }\n\n        function renderHome() {\n            const dayLabel = DAYS.find(d => d[0] === currentDay)[1];\n            const wrap = document.getElementById('planList');\n            wrap.innerHTML = '';\n            planIds().forEach(plan => {\n                const list = PLANS[plan][currentWeek] || [];\n                const done = list.filter((_, i) => {\n                    const d = data[`${plan}_${currentWeek}_${currentDay}_${i}`];\n                    return d && d.loggedSets && d.loggedSets.length;\n                }).length;\n                const status = done ? `Week ${currentWeek}, ${dayLabel}: ${done} of ${list.length} exercises logged` : `Week ${currentWeek}, ${dayLabel}: not started`;\n                const item = document.createElement('div');\n                item.className = 'plan-item';\n                item.innerHTML = `\n                    \u003cbutton class=\"plan-card\" type=\"button\">\n                        \u003cspan class=\"plan-card-main\">\n                            \u003cspan class=\"plan-card-title\">${escHTML(planName(plan))}\u003c/span>\n                            \u003cspan class=\"plan-card-sub\">${escHTML(planSub(plan))}\u003c/span>\n                            \u003cspan class=\"plan-card-status${done ? ' in-progress' : ''}\">${status}\u003c/span>\n                        \u003c/span>\n                        \u003cspan class=\"plan-card-chevron\" aria-hidden=\"true\">&#8250;\u003c/span>\n                    \u003c/button>\n                    \u003cdiv class=\"plan-actions\">\u003cbutton type=\"button\" data-act=\"edit\">Edit\u003c/button>\u003cbutton type=\"button\" data-act=\"copy\">Duplicate\u003c/button>${hasOverride(plan) ? '\u003cbutton type=\"button\" data-act=\"reset\">Reset to original\u003c/button>' : ''}\u003cbutton type=\"button\" data-act=\"del\" class=\"danger\">Delete\u003c/button>\u003c/div>`;\n                item.querySelector('.plan-card').addEventListener('click', () => { currentPlan = plan; go('log'); });\n                item.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {\n                    if (b.dataset.act === 'edit') openEditor('edit', plan);\n                    else if (b.dataset.act === 'copy') duplicateProgram(plan);\n                    else if (b.dataset.act === 'del') deleteProgram(plan);\n                    else if (b.dataset.act === 'reset') resetBuiltin(plan);\n                }));\n                wrap.appendChild(item);\n            });\n            const hiddenIds = Object.keys(hiddenPlans()).filter(id => hiddenPlans()[id] && BUILTIN_PLANS[id]);\n            if (hiddenIds.length) {\n                const r = document.createElement('div');\n                r.className = 'plan-actions';\n                r.innerHTML = `\u003cbutton type=\"button\">Restore deleted ${hiddenIds.map(id => escHTML(BUILTIN_PLANS[id].name)).join(' and ')} program${hiddenIds.length > 1 ? 's' : ''}\u003c/button>`;\n                r.querySelector('button').addEventListener('click', () => {\n                    data._hidden = {};\n                    saveData(); rebuildPlans(); renderExercises();\n                    showToast('Programs restored');\n                });\n                wrap.appendChild(r);\n            }\n            updateBackupUI();\n            document.getElementById('startDate').value = toISO(getStartDate());\n            const s = weekSummary(currentWeek);\n            document.getElementById('reportStatus').textContent =\n                `Week ${currentWeek}: ${s.trained} workout${s.trained === 1 ? '' : 's'} · ${s.sets} sets`;\n        }\n\n        function go(v) {\n            view = v;\n            editing = null;\n            if (v !== 'editor') ed = null;\n            closePicker(false);\n            closeAuto();\n            renderExercises();\n            window.scrollTo(0, 0);\n        }\n\n        document.getElementById('newProgram').addEventListener('click', () => openEditor('new'));\n        document.getElementById('openReport').addEventListener('click', () => go('report'));\n        document.getElementById('backBtn').addEventListener('click', async () => {\n            if (view === 'editor' && ed && ed.dirty && !(await askConfirm('Discard your changes to this program?', 'Discard', true))) return;\n            go('home');\n        });\n\n        function renderDays() {\n            const list = PLANS[currentPlan][currentWeek] || [];\n            const el = document.getElementById('daySelector');\n            el.innerHTML = '';\n            DAYS.forEach(([id, label]) => {\n                const base = `${currentPlan}_${currentWeek}_${id}_`;\n                const hasData = list.some((_, i) => {\n                    const d = data[base + i];\n                    return d && ((d.loggedSets && d.loggedSets.length) || d.note);\n                }) || (data[base + 'warmup'] || []).length > 0 || (data[base + 'cooldown'] || []).length > 0;\n                const b = document.createElement('button');\n                b.className = 'day-btn' + (id === currentDay ? ' active' : '') + (hasData ? ' has-data' : '');\n                b.textContent = label;\n                b.addEventListener('click', () => { currentDay = id; editing = null; renderExercises(); });\n                el.appendChild(b);\n            });\n        }\n\n        function weekSummary(week) {\n            let sets = 0, volume = 0, trained = 0;\n            const days = DAYS.map(([id, label]) => {\n                const sessions = [];\n                planIds().forEach(plan => {\n                    const items = [];\n                    (PLANS[plan][week] || []).forEach((ex, i) => {\n                        const d = data[`${plan}_${week}_${id}_${i}`];\n                        if (d && ((d.loggedSets && d.loggedSets.length) || d.note)) {\n                            const si = ssInfo(plan, week)[i];\n                            items.push({ name: ex.exercise, sets: d.loggedSets || [], note: d.note || '', tag: si ? si.tag : '' });\n                        }\n                    });\n                    const warmup = Array.isArray(data[`${plan}_${week}_${id}_warmup`]) ? data[`${plan}_${week}_${id}_warmup`] : [];\n                    const cooldown = Array.isArray(data[`${plan}_${week}_${id}_cooldown`]) ? data[`${plan}_${week}_${id}_cooldown`] : [];\n                    if (items.length || warmup.length || cooldown.length) sessions.push({ plan, items, warmup, cooldown });\n                });\n                if (sessions.some(s => s.items.some(it => it.sets.length))) trained++;\n                sessions.forEach(s => s.items.forEach(it => it.sets.forEach(x => { sets++; volume += x.weight * x.reps; })));\n                return { label, sessions };\n            });\n            return { days, sets, volume: Math.round(volume), trained };\n        }\n\n        function renderReport() {\n            const s = weekSummary(currentWeek);\n            const prev = currentWeek > 1 ? weekSummary(currentWeek - 1) : null;\n            let delta = '';\n            if (prev && prev.volume > 0) {\n                const pct = Math.round((s.volume - prev.volume) / prev.volume * 100);\n                delta = `\u003cspan class=\"stat-label\">${pct >= 0 ? '+' : ''}${pct}% vs week ${currentWeek - 1}\u003c/span>`;\n            }\n            let html = `\u003cdiv class=\"report-toolbar\">\n                \u003cdiv>\u003ch2>Training report: Week ${currentWeek}\u003c/h2>\u003cdiv class=\"report-meta\">${weekRangeText(currentWeek, '\\u2013')} · Generated ${new Date().toLocaleDateString('en-GB')}\u003c/div>\u003c/div>\n                \u003cbutton class=\"export\" onclick=\"exportReportPdf()\">Export PDF\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"report-summary\">\n                \u003cdiv class=\"stat\">\u003cspan class=\"stat-label\">Workouts\u003c/span>\u003cspan class=\"stat-value\">${s.trained}\u003c/span>\u003c/div>\n                \u003cdiv class=\"stat\">\u003cspan class=\"stat-label\">Sets\u003c/span>\u003cspan class=\"stat-value\">${s.sets}\u003c/span>\u003c/div>\n                \u003cdiv class=\"stat\">\u003cspan class=\"stat-label\">Volume\u003c/span>\u003cspan class=\"stat-value\">${s.volume} kg\u003c/span>${delta}\u003c/div>\n            \u003c/div>`;\n            if (!s.days.some(d => d.sessions.length)) {\n                html += `\u003cdiv class=\"empty-state\">\u003cp>No workouts logged for week ${currentWeek}.\u003c/p>\u003c/div>`;\n            }\n            const wow = weekOnWeek(currentWeek);\n            if (wow.length) {\n                const f = x => `${fmtNum(x.topW)} kg × ${x.topR} top set · ${Math.round(x.vol)} kg volume`;\n                html += `\u003cdiv class=\"wow\">\u003cdiv class=\"wow-title\">Week on week${currentWeek > 1 ? ` (vs week ${currentWeek - 1})` : ''}\u003c/div>` +\n                    wow.map(r => {\n                        const arrow = !r.delta ? '' : r.delta.dir > 0 ? '▲ ' : r.delta.dir \u003c 0 ? '▼ ' : '– ';\n                        const head = r.delta ? `\u003cspan class=\"wow-delta d${r.delta.dir}\">${arrow}${r.delta.text}\u003c/span>`\n                            : `\u003cspan class=\"wow-delta\">${currentWeek > 1 ? 'Not logged last week' : ''}\u003c/span>`;\n                        return `\u003cdiv class=\"wow-row\">\u003cdiv class=\"wow-head\">\u003cspan class=\"wow-name\">${r.c.name}\u003c/span>${head}\u003c/div>` +\n                            `\u003cdiv class=\"wow-line\">This week: ${f(r.c)}\u003c/div>` +\n                            (currentWeek > 1 ? `\u003cdiv class=\"wow-line\">Week ${currentWeek - 1}: ${r.p ? f(r.p) : 'not logged'}\u003c/div>` : '') + `\u003c/div>`;\n                    }).join('') + `\u003c/div>`;\n            }\n            const sessionBlock = (title, list) => list.length ? `\u003cdiv class=\"report-ex\">\u003cdiv class=\"report-ex-name\">${title}\u003c/div>${list.map(e => { const d = describeEntry(e); return `\u003cdiv class=\"report-set\">\u003cspan>${d.label}\u003c/span>\u003cspan>${d.detail}\u003c/span>\u003c/div>`; }).join('')}\u003c/div>` : '';\n            s.days.forEach(day => day.sessions.forEach(sess => {\n                let vol = 0;\n                sess.items.forEach(it => it.sets.forEach(x => vol += x.weight * x.reps));\n                html += `\u003cdiv class=\"report-day\">\n                    \u003cdiv class=\"report-day-head\">\u003cstrong>${day.label} · ${escHTML(planName(sess.plan))}\u003c/strong>\u003cspan>${sess.items.length ? Math.round(vol) + ' kg' : ''}\u003c/span>\u003c/div>\n                    ${sessionBlock('Warm-up', sess.warmup)}\n                    ${sess.items.map(it => `\u003cdiv class=\"report-ex\">\u003cdiv class=\"report-ex-name\">${it.name}${it.tag ? ` \u003cspan class=\"ss-tag\">${it.tag}\u003c/span>` : ''}\u003c/div>${it.sets.map((x, n) => `\u003cdiv class=\"report-set\">\u003cspan>Set ${n + 1}\u003c/span>\u003cspan>${x.weight} kg × ${x.reps} reps\u003c/span>\u003c/div>`).join('')}${it.note ? `\u003cdiv class=\"report-note\">Note: ${escHTML(it.note)}\u003c/div>` : ''}\u003c/div>`).join('')}\n                    ${sessionBlock('Cool-down', sess.cooldown)}\n                \u003c/div>`;\n            }));\n            document.getElementById('reportContainer').innerHTML = html;\n        }\n\n        function exportReportPdf() {\n            const s = weekSummary(currentWeek);\n            const L = [];\n            L.push({ t: `Training report - Week ${currentWeek}`, size: 18, bold: true });\n            L.push({ t: `${weekRangeText(currentWeek, '-')}   |   Generated ${new Date().toLocaleDateString('en-GB')}`, size: 9, gap: 2 });\n            L.push({ t: `Workouts: ${s.trained}    Sets: ${s.sets}    Volume: ${s.volume} kg`, size: 11, bold: true, gap: 10 });\n            if (!s.days.some(d => d.sessions.length)) L.push({ t: 'No workouts logged this week.', size: 11, gap: 10 });\n            const pdfBlock = (title, list) => {\n                if (!list.length) return;\n                L.push({ t: title, size: 11, bold: true, gap: 6 });\n                list.forEach(e => { const d = describeEntry(e); L.push({ t: `${d.label}:  ${d.detail}`, size: 10, indent: 14 }); });\n            };\n            const wowRows = weekOnWeek(currentWeek);\n            if (wowRows.length) {\n                const f = x => `${fmtNum(x.topW)} kg x ${x.topR} top set, ${Math.round(x.vol)} kg volume`;\n                L.push({ t: `Week on week${currentWeek > 1 ? ` (vs week ${currentWeek - 1})` : ''}`, size: 12, bold: true, gap: 14 });\n                wowRows.forEach(r => {\n                    L.push({ t: r.c.name, size: 10, bold: true, gap: 5 });\n                    L.push({ t: `This week: ${f(r.c)}`, size: 10, indent: 14 });\n                    if (currentWeek > 1) {\n                        L.push({ t: `Week ${currentWeek - 1}: ${r.p ? f(r.p) : 'not logged'}`, size: 10, indent: 14 });\n                        L.push({ t: `Change: ${r.delta ? r.delta.text.replace(/ · /g, ', ') : 'not logged last week'}`, size: 10, indent: 14 });\n                    }\n                });\n            }\n            s.days.forEach(day => day.sessions.forEach(sess => {\n                let vol = 0;\n                sess.items.forEach(it => it.sets.forEach(x => vol += x.weight * x.reps));\n                L.push({ t: `${day.label} - ${planName(sess.plan)}  ${sess.items.length ? `(${Math.round(vol)} kg total)` : ''}`, size: 13, bold: true, gap: 16 });\n                pdfBlock('Warm-up', sess.warmup);\n                sess.items.forEach(it => {\n                    L.push({ t: it.name + (it.tag ? `  (${it.tag})` : ''), size: 11, bold: true, gap: 6 });\n                    it.sets.forEach((x, n) => L.push({ t: `Set ${n + 1}:  ${x.weight} kg x ${x.reps} reps`, size: 10, indent: 14 }));\n                    if (it.note) wrapText('Note: ' + it.note, 85).forEach(line => L.push({ t: line, size: 10, indent: 14 }));\n                });\n                pdfBlock('Cool-down', sess.cooldown);\n            }));\n\n            const W = 595, H = 842, M = 40;\n            const esc = str => String(str).replace(/[^\\x20-\\x7E]/g, '?').replace(/([\\\\()])/g, '\\\\$1');\n            const pages = [];\n            let ops = [], y = H - M;\n            const newPage = () => { pages.push(ops.join('\\n')); ops = []; y = H - M; };\n            L.forEach(l => {\n                const lh = l.size * 1.4, need = (l.gap || 0) + lh;\n                if (y - need \u003c M) newPage();\n                y -= (l.gap || 0) + l.size;\n                ops.push(`BT /${l.bold ? 'F2' : 'F1'} ${l.size} Tf ${M + (l.indent || 0)} ${y.toFixed(1)} Td (${esc(l.t)}) Tj ET`);\n                y -= lh - l.size;\n            });\n            pages.push(ops.join('\\n'));\n\n            const objs = [];\n            const n = pages.length;\n            objs[1] = '\u003c\u003c /Type /Catalog /Pages 2 0 R >>';\n            objs[2] = `\u003c\u003c /Type /Pages /Count ${n} /Kids [${pages.map((_, i) => `${5 + i * 2} 0 R`).join(' ')}] >>`;\n            objs[3] = '\u003c\u003c /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';\n            objs[4] = '\u003c\u003c /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';\n            pages.forEach((c, i) => {\n                objs[5 + i * 2] = `\u003c\u003c /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources \u003c\u003c /Font \u003c\u003c /F1 3 0 R /F2 4 0 R >> >> /Contents ${6 + i * 2} 0 R >>`;\n                objs[6 + i * 2] = `\u003c\u003c /Length ${c.length} >>\\nstream\\n${c}\\nendstream`;\n            });\n            let pdf = '%PDF-1.4\\n';\n            const offs = [];\n            for (let i = 1; i \u003c objs.length; i++) { offs[i] = pdf.length; pdf += `${i} 0 obj\\n${objs[i]}\\nendobj\\n`; }\n            const xref = pdf.length;\n            pdf += `xref\\n0 ${objs.length}\\n0000000000 65535 f \\n`;\n            for (let i = 1; i \u003c objs.length; i++) pdf += String(offs[i]).padStart(10, '0') + ' 00000 n \\n';\n            pdf += `trailer\\n\u003c\u003c /Size ${objs.length} /Root 1 0 R >>\\nstartxref\\n${xref}\\n%%EOF`;\n\n            const bytes = new Uint8Array(pdf.length);\n            for (let i = 0; i \u003c pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 255;\n            const name = `training-report-week-${currentWeek}.pdf`;\n            const file = new File([bytes], name, { type: 'application/pdf' });\n\n            if (navigator.canShare && navigator.canShare({ files: [file] })) {\n                navigator.share({ files: [file], title: `Training report - Week ${currentWeek}` }).catch(() => {});\n                return;\n            }\n            const url = URL.createObjectURL(file);\n            const a = document.createElement('a');\n            a.href = url; a.download = name;\n            document.body.appendChild(a); a.click(); a.remove();\n            setTimeout(() => URL.revokeObjectURL(url), 5000);\n            showToast('PDF saved');\n        }\n\n        window.addEventListener('beforeprint', () => {\n            document.title = `Training report - Week ${currentWeek}`;\n        });\n        window.addEventListener('afterprint', () => {\n            document.title = 'Training Tracker';\n        });\n\n        /* ---------- Automatic backup ---------- */\n        // Safari on iPhone does not let a web page write to the Files app in the background, so this works in layers:\n        // 1) a second copy of your data inside the browser (IndexedDB) after every change and when the app is closed or hidden,\n        //    with the last 7 days kept, checked on open and restored automatically if the main copy is missing or damaged;\n        // 2) where the browser supports it (Chrome / Edge on desktop and Android) an automatic backup file in a folder you pick;\n        // 3) a one-tap \"Back up to Files\" share sheet on iPhone, with a reminder when it has been a while.\n        const BK = { db: null, dirHandle: null, dirState: 'none', timer: null, lsState: 'ok', persisted: null };\n        const BK_FILE = 'training-tracker-backup.json';\n        const LAST_KEY = 'trainingTrackerLastBackup';\n        const FS_OK = typeof window.showDirectoryPicker === 'function';\n\n        function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }\n        function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }\n        function fmtAgo(ts) {\n            const m = Math.round((Date.now() - ts) / 60000);\n            if (m \u003c 1) return 'just now';\n            if (m \u003c 60) return `${m} min ago`;\n            const h = Math.round(m / 60);\n            if (h \u003c 24) return `${h} h ago`;\n            const d = Math.round(h / 24);\n            return `${d} day${d === 1 ? '' : 's'} ago`;\n        }\n        function fmtWhen(ts) { return new Date(ts).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }\n        // True when there is something worth protecting: logged sets or notes, or your own program changes.\n        // Settings alone (start date, rest timer) are not enough, so a fresh or cleared app never replaces a good backup.\n        function hasContent(d) {\n            if (!d || typeof d !== 'object') return false;\n            return Object.keys(d).some(k => {\n                if (/^[a-z0-9]+_\\d+_[a-z]{3}_/.test(k)) return true;\n                if (['_programs', '_overrides', '_hidden', '_supersets', '_restOv'].includes(k)) {\n                    const v = d[k];\n                    return !!v && typeof v === 'object' && Object.keys(v).length > 0;\n                }\n                return false;\n            });\n        }\n\n        function idbDb() {\n            if (BK.db) return Promise.resolve(BK.db);\n            return new Promise((res, rej) => {\n                if (!window.indexedDB) { rej(new Error('IndexedDB unavailable')); return; }\n                const r = indexedDB.open('trainingTrackerBackup', 1);\n                r.onupgradeneeded = () => r.result.createObjectStore('kv');\n                r.onsuccess = () => { BK.db = r.result; res(r.result); };\n                r.onerror = () => rej(r.error);\n            });\n        }\n        function idbReq(mode, fn) {\n            return idbDb().then(db => new Promise((res, rej) => {\n                const tx = db.transaction('kv', mode);\n                const q = fn(tx.objectStore('kv'));\n                tx.oncomplete = () => res(q ? q.result : undefined);\n                tx.onerror = () => rej(tx.error);\n                tx.onabort = () => rej(tx.error);\n            }));\n        }\n        const idbGet = k => idbReq('readonly', s => s.get(k));\n        const idbSet = (k, v) => idbReq('readwrite', s => s.put(v, k));\n        const idbDel = k => idbReq('readwrite', s => s.delete(k));\n        const idbKeys = () => idbReq('readonly', s => s.getAllKeys());\n\n        async function writeFolderBackup() {\n            if (!BK.dirHandle) return;\n            BK.dirState = await dirPermission(false);\n            if (BK.dirState !== 'granted') return;\n            const fh = await BK.dirHandle.getFileHandle(BK_FILE, { create: true });\n            const w = await fh.createWritable();\n            await w.write(JSON.stringify(data, null, 2));\n            await w.close();\n            lsSet(LAST_KEY, String(Date.now()));\n        }\n\n        async function backupNow() {\n            if (!hasContent(data)) return; // never replace a good backup with an empty one\n            try {\n                const json = JSON.stringify(data), ts = Date.now();\n                await idbSet('snap:latest', { ts, json });\n                await idbSet('snap:day:' + new Date(ts).toISOString().slice(0, 10), { ts, json });\n                const days = (await idbKeys()).filter(k => typeof k === 'string' && k.indexOf('snap:day:') === 0).sort();\n                for (const k of days.slice(0, Math.max(0, days.length - 7))) await idbDel(k);\n            } catch (e) {}\n            try { await writeFolderBackup(); } catch (e) {}\n            updateBackupUI();\n        }\n        function scheduleBackup() {\n            clearTimeout(BK.timer);\n            BK.timer = setTimeout(() => { BK.timer = null; backupNow(); }, 1500);\n        }\n        function flushBackup() {\n            clearTimeout(BK.timer); BK.timer = null;\n            backupNow();\n        }\n        document.addEventListener('visibilitychange', () => { if (document.hidden) flushBackup(); });\n        window.addEventListener('pagehide', flushBackup);\n\n        async function dirPermission(request) {\n            const h = BK.dirHandle;\n            if (!h || !h.queryPermission) return 'none';\n            try {\n                const opts = { mode: 'readwrite' };\n                let p = await h.queryPermission(opts);\n                if (p !== 'granted' && request) p = await h.requestPermission(opts);\n                return p;\n            } catch (e) { return 'denied'; }\n        }\n        async function readFolderBackup() {\n            try {\n                const fh = await BK.dirHandle.getFileHandle(BK_FILE);\n                const f = await fh.getFile();\n                const d = JSON.parse(await f.text());\n                return d && typeof d === 'object' && !Array.isArray(d) ? d : null;\n            } catch (e) { return null; }\n        }\n\n        function applyRestored(d) {\n            data = d;\n            currentPlan = 'gym';\n            saveData();\n            rebuildPlans();\n            renderExercises();\n        }\n\n        // Runs when the app opens: check the main copy and the backup folder\n        async function startupBackupCheck() {\n            try {\n                if (navigator.storage && navigator.storage.persist) BK.persisted = await navigator.storage.persist();\n            } catch (e) {}\n            try { BK.dirHandle = (await idbGet('dirHandle')) || BK.dirHandle || null; } catch (e) {}\n            if (BK.dirHandle) BK.dirState = await dirPermission(false);\n            try {\n                if (BK.lsState !== 'ok') {\n                    let restored = null, when = 0;\n                    try {\n                        const s = await idbGet('snap:latest');\n                        if (s) { const d = JSON.parse(s.json); if (hasContent(d)) { restored = d; when = s.ts; } }\n                    } catch (e) {}\n                    if (BK.dirState === 'granted') {\n                        const f = await readFolderBackup();\n                        if (f && hasContent(f) && (f._savedAt || 0) > (restored && restored._savedAt || 0)) { restored = f; when = f._savedAt || Date.now(); }\n                    }\n                    if (restored) {\n                        applyRestored(restored);\n                        showToast(`Restored from automatic backup (${fmtWhen(when)})`);\n                    }\n                } else if (BK.dirState === 'granted') {\n                    const f = await readFolderBackup();\n                    if (f && hasContent(f) && (f._savedAt || 0) > (data._savedAt || 0) + 2000) {\n                        const yes = await askConfirm(`A newer backup was found in your backup folder (${fmtWhen(f._savedAt)}). Load it? This replaces what is on this device.`, 'Load backup');\n                        if (yes) { applyRestored(f); showToast('Loaded backup from folder'); }\n                    }\n                }\n            } catch (e) {}\n            await backupNow();\n            updateBackupUI();\n        }\n\n        async function backupToFiles() {\n            const json = JSON.stringify(data, null, 2);\n            const name = `training-tracker-${new Date().toISOString().split('T')[0]}.json`;\n            try {\n                const f = new File([json], name, { type: 'application/json' });\n                if (navigator.canShare && navigator.canShare({ files: [f] })) {\n                    await navigator.share({ files: [f], title: 'Training tracker backup' });\n                    lsSet(LAST_KEY, String(Date.now()));\n                    updateBackupUI();\n                    return;\n                }\n            } catch (e) { if (e && e.name === 'AbortError') return; }\n            exportData();\n        }\n\n        async function chooseBackupFolder() {\n            try {\n                const h = await window.showDirectoryPicker({ mode: 'readwrite' });\n                BK.dirHandle = h;\n                try { await idbSet('dirHandle', h); } catch (e) {}\n                BK.dirState = await dirPermission(true);\n                await backupNow();\n                showToast(BK.dirState === 'granted' ? 'Auto-backup folder set' : 'Folder needs permission');\n            } catch (e) { /* cancelled */ }\n            updateBackupUI();\n        }\n        async function reconnectFolder() {\n            BK.dirState = await dirPermission(true);\n            if (BK.dirState === 'granted') await backupNow();\n            updateBackupUI();\n        }\n        async function stopFolder() {\n            BK.dirHandle = null; BK.dirState = 'none';\n            try { await idbDel('dirHandle'); } catch (e) {}\n            updateBackupUI();\n        }\n\n        async function essage, yesLabel, danger) {\n            return new Promise(resolve => {\n                const wrap = document.getElementById('confirmWrap');\n                const yes = document.getElementById('confirmYes'), no = document.getElementById('confirmNo');\n                document.getElementById('confirmMsg').textContent = message;\n                yes.textContent = yesLabel || 'OK';\n                yes.className = danger ? 'danger' : 'ed-primary';\n                wrap.classList.remove('hidden');\n                const done = v => { wrap.classList.add('hidden'); yes.onclick = null; no.onclick = null; resolve(v); };\n                yes.onclick = () => done(true);\n                no.onclick = () => done(false);\n            });\n        }\n\n        /* ---------- Auto-create a program ---------- */\n        const AUTO_PRIORITY = ['Legs', 'Back', 'Chest', 'Shoulders', 'Glutes', 'Biceps', 'Triceps', 'Abdomen', 'Calves', 'Forearms'];\n        const AUTO_BASECAP = { Legs: 3, Back: 3, Chest: 3, Shoulders: 3, Glutes: 2, Biceps: 2, Triceps: 2, Abdomen: 2, Calves: 2, Forearms: 2 };\n        const AUTO_PRESETS = [\n            ['Full body', ['Chest', 'Back', 'Shoulders', 'Legs', 'Biceps', 'Triceps', 'Abdomen']],\n            ['Upper body', ['Chest', 'Back', 'Shoulders', 'Biceps', 'Triceps']],\n            ['Lower body', ['Legs', 'Glutes', 'Calves', 'Abdomen']],\n            ['Push', ['Chest', 'Shoulders', 'Triceps']],\n            ['Pull', ['Back', 'Biceps']]\n        ];\n        // Each area is a list of movement patterns in the order they are used. A program takes at most one\n        // exercise per pattern, so you never get several versions of the same movement (for example three presses).\n        // Names must exist in EXERCISE_DB.\n        const AUTO_PATTERNS = {\n            Chest: [\n                ['Flat Bench Press Dumbbell', 'Incline Dumbbell Press', 'Neutral Grip Dumbbell Press', 'Chest Press Machine', 'Incline Chest Press Machine', 'Dumbbell Floor Press'],\n                ['Dumbbell Flyes', 'Incline Dumbbell Flyes', 'Pec Deck', 'Cable Fly']\n            ],\n            Back: [\n                ['Single Arm Dumbbell Row', 'Bent Over Dumbbell Row', 'Chest Supported Dumbbell Row', 'Seated Cable Row', 'Machine Row'],\n                ['Lat Pulldown', 'Assisted Pull-Up Machine'],\n                ['Pullover Dumbbell', 'Straight Arm Pulldown'],\n                ['Superman', 'Back Extension']\n            ],\n            Shoulders: [\n                ['Shoulder Press Dumbbell', 'Seated Dumbbell Shoulder Press', 'Arnold Press', 'Shoulder Press Machine'],\n                ['Dumbbell Lateral Raises', 'Seated Dumbbell Lateral Raises', 'Lat Raises Cable Machine'],\n                ['Reverse Dumbbell Flyes', 'Bent Over Rear Delt Raises', 'Rear Delt Machine', 'Face Pull'],\n                ['Dumbbell Shrugs', 'Dumbbell Front Raises']\n            ],\n            Biceps: [\n                ['Alternating Dumbbell Curls', 'Standing Dumbbell Curls', 'Seated Dumbbell Curls', 'Cable Curls', 'Single Arm D-Handle Curls'],\n                ['Dumbbell Hammer Curls', 'Cross Body Hammer Curls', 'Cable Rope Curls'],\n                ['Incline Dumbbell Curls', 'Dumbbell Spider Curls']\n            ],\n            Triceps: [\n                ['Dumbbell Overhead Triceps Extension', 'Single Arm Overhead Triceps Extension', 'Overhead Cable Triceps Extension'],\n                ['Lying Dumbbell Triceps Extension', 'Rope Pushdown', 'Straight Bar Triceps Pushdown', 'Dumbbell Tate Press'],\n                ['Bench Dips', 'Close Grip Push-Ups', 'Diamond Push-Ups'],\n                ['Dumbbell Triceps Kickbacks']\n            ],\n            Legs: [\n                ['Goblet Squat', 'Dumbbell Squat', 'Dumbbell Front Squat', 'Leg Press', 'Hack Squat Machine'],\n                ['Romanian Deadlifts Dumbbell', 'Dumbbell Stiff Leg Deadlift'],\n                ['Bulgarian Split Squat Dumbbell', 'Dumbbell Reverse Lunges', 'Dumbbell Walking Lunges', 'Dumbbell Step-Ups', 'Dumbbell Split Squat'],\n                ['Seated Leg Curl', 'Lying Leg Curl', 'Dumbbell Hamstring Curls'],\n                ['Leg Extension']\n            ],\n            Glutes: [\n                ['Dumbbell Hip Thrust', 'Dumbbell Glute Bridge'],\n                ['Dumbbell Sumo Deadlift', 'Dumbbell Good Mornings', 'Cable Pull-Through'],\n                ['Single Leg Dumbbell Hip Thrust', 'Single Leg Dumbbell Glute Bridge'],\n                ['Cable Glute Kickback', 'Donkey Kicks']\n            ],\n            Calves: [\n                ['Standing Dumbbell Calf Raises', 'Leg Press Calf Raises', 'Standing Calf Raise Machine', 'Bodyweight Calf Raises'],\n                ['Seated Dumbbell Calf Raises', 'Seated Calf Raise Machine'],\n                ['Single Leg Dumbbell Calf Raises']\n            ],\n            Abdomen: [\n                ['Plank Dumbbell Drags', 'Plank', 'Dead Bug'],\n                ['Weighted Dumbbell Crunches', 'Cable Crunch', 'Crunches', 'Reverse Crunches'],\n                ['Dumbbell Russian Twists', 'Dumbbell Woodchoppers', 'Cable Woodchoppers'],\n                ['Suitcases', 'Dumbbell Side Bends', 'Dumbbell Windmills']\n            ],\n            Forearms: [\n                ['Dumbbell Wrist Curls'],\n                ['Reverse Dumbbell Curls'],\n                ['Dumbbell Reverse Wrist Curls']\n            ]\n        };\n        const AUTO_MAXCAP = { Biceps: 3, Triceps: 3, Calves: 2, Forearms: 2, Abdomen: 3, Chest: 2 };\n        const KIND_RANK = { cl: 0, cu: 1, sl: 2, sc: 3, cv: 4, is: 5, ca: 6, co: 7 };\n        const HEAVY = ['cl', 'cu', 'sl'];\n        const ag = { dur: 45, areas: new Set(AUTO_PRESETS[0][1]), equip: 'dbbw', goal: 'muscle' };\n\n        function autoEquipOK(item, equip) {\n            if (equip === 'all') return true;\n            if (equip === 'db') return item.equip === EQUIP_DB;\n            return item.equip !== EQUIP_MC;\n        }\n        function autoDefaults(item, goal, level) {\n            const k = KIND[item.kind];\n            let reps = k.reps, rest = k.rest, sets = parseInt(k.sets, 10);\n            if (goal === 'strength' && HEAVY.includes(item.kind)) {\n                reps = '5-8'; sets = 4; rest = item.kind === 'cl' ? 180 : item.kind === 'cu' ? 150 : 120;\n            } else if (goal === 'endurance') {\n                if (item.kind !== 'co' && item.kind !== 'ca') reps = '12-15';\n                rest = Math.max(30, rest - 30); sets = 3;\n            }\n            if (level >= 1 && !HEAVY.includes(item.kind)) sets = Math.min(sets, 2);\n            if (level >= 2) { sets = Math.min(sets, 2); rest = Math.max(30, Math.round(rest * 0.75 / 15) * 15); }\n            return { reps, rest, sets };\n        }\n        // About 40 s of work per set, the rest between sets, and about a minute to set up and move to the next exercise\n        function exSeconds(sets, rest) { return sets * 40 + Math.max(0, sets - 1) * rest + 60; }\n        function takeRandom(list, n) { return list.splice(Math.floor(Math.random() * Math.min(n, list.length)), 1)[0]; }\n        // Next movement pattern for an area: one random choice from the first few that fit the equipment\n        function autoNext(state, taken) {\n            while (state.idx \u003c state.patterns.length) {\n                const list = state.patterns[state.idx++].filter(e => !taken.has(e.exercise));\n                if (list.length) return takeRandom(list, 3);\n            }\n            return null;\n        }\n\n        function autoBuild(p, level) {\n            const areas = AUTO_PRIORITY.filter(a => p.areas.has(a));\n            const budget = Math.max(10, p.dur - 5) * 60; // keep about 5 min for warm-up and cool-down\n            const slots = Math.max(1, Math.floor(budget / 430));\n            const cap = a => Math.min(Math.max(AUTO_BASECAP[a], Math.ceil(slots / areas.length)), AUTO_MAXCAP[a] || 4);\n            const st = {}, taken = new Set();\n            areas.forEach(a => {\n                const patterns = AUTO_PATTERNS[a].map(names => names.map(dbFind).filter(e => e && autoEquipOK(e, p.equip))).filter(l => l.length);\n                st[a] = { patterns, idx: 0, picks: [], full: false };\n            });\n            const rows = [];\n            let used = 0, progress = true;\n            while (progress) {\n                progress = false;\n                for (const a of areas) {\n                    const s = st[a];\n                    if (s.full || s.picks.length >= cap(a)) continue;\n                    const item = autoNext(s, taken);\n                    if (!item) { s.full = true; continue; }\n                    const d = autoDefaults(item, p.goal, level), sec = exSeconds(d.sets, d.rest);\n                    if (rows.length && used + sec > budget) { s.full = true; continue; }\n                    const b = builtinMatch(item.exercise);\n                    s.picks.push(item); taken.add(item.exercise);\n                    rows.push({\n                        exercise: item.exercise, bodyPart: item.bodyPart, kind: item.kind,\n                        repRange: d.reps, sets: String(d.sets), rest: d.rest,\n                        video: b && b.video ? b.video : '', orig: null, ssNext: false, free: false\n                    });\n                    used += sec; progress = true;\n                }\n            }\n            // Spare time: add sets, compounds first\n            [['cl', 'cu', 'sl', 'sc', 'cv'], ['is', 'ca', 'co']].forEach(kinds => {\n                let bumped = true;\n                while (bumped) {\n                    bumped = false;\n                    rows.forEach(r => {\n                        if (!kinds.includes(r.kind)) return;\n                        const cur = parseInt(r.sets, 10), max = (p.goal === 'strength' && HEAVY.includes(r.kind)) ? 5 : 4;\n                        if (cur >= max) return;\n                        const add = exSeconds(cur + 1, r.rest) - exSeconds(cur, r.rest);\n                        if (used + add \u003c= budget) { r.sets = String(cur + 1); used += add; bumped = true; }\n                    });\n                }\n            });\n            const ordered = rows.map((r, i) => [r, i]).sort((x, y) => (KIND_RANK[x[0].kind] - KIND_RANK[y[0].kind]) || (x[1] - y[1])).map(x => x[0]);\n            const left = areas.filter(a => !st[a].picks.length);\n            const preset = AUTO_PRESETS.find(pr => pr[1].length === areas.length && pr[1].every(a => p.areas.has(a)));\n            const label = preset ? preset[0] : (areas.length \u003c= 3 ? areas.join(', ') : `${areas.length} areas`);\n            const est = Math.round(used / 60);\n            let note = `Auto-created for ${p.dur} min: about ${est} min of training plus warm-up and cool-down, ${ordered.length} exercises.`;\n            if (level > 0) note += ' Short on time, so sets and rest were trimmed to fit every area.';\n            if (!left.length && used \u003c budget * 0.7) note += ' These areas do not have enough different movements to fill the whole session, so consider adding another area.';\n            if (left.length) note += ` No room for: ${left.join(', ')}. Try a longer session or fewer areas.`;\n            return { name: cleanText(`Auto: ${label} ${p.dur} min`, 40), rows: ordered, note, left };\n        }\n        function autoGenerate(p) {\n            let g;\n            for (let level = 0; level \u003c= 2; level++) { g = autoBuild(p, level); if (!g.left.length) break; }\n            return g;\n        }\n\n        function openAutoEditor(p) {\n            const g = autoGenerate(p);\n            if (!g.rows.length) { showToast('No exercises found for those choices'); return; }\n            ed = { baseId: null, builtin: false, name: g.name, rows: g.rows, dirty: true, auto: { dur: p.dur, equip: p.equip, goal: p.goal, areas: Array.from(p.areas) }, note: g.note };\n            go('editor');\n        }\n\n        function renderAuto() {\n            const el = document.getElementById('autoGen');\n            el.querySelector('#agDur').innerHTML = [20, 30, 45, 60, 75, 90].map(m =>\n                `\u003cbutton type=\"button\" class=\"pk-chip${ag.dur === m ? ' on' : ''}\" data-dur=\"${m}\">${m} min\u003c/button>`).join('');\n            el.querySelector('#agPresets').innerHTML = AUTO_PRESETS.map((pr, i) =>\n                `\u003cbutton type=\"button\" class=\"pk-chip\" data-preset=\"${i}\">${pr[0]}\u003c/button>`).join('');\n            el.querySelector('#agAreas').innerHTML = AUTO_PRIORITY.slice().sort((a, b) => GROUPS.indexOf(a) - GROUPS.indexOf(b)).map(a =>\n                `\u003cbutton type=\"button\" class=\"pk-chip${ag.areas.has(a) ? ' on' : ''}\" data-area=\"${a}\">${a}\u003c/button>`).join('');\n            el.querySelector('#agEquip').value = ag.equip;\n            el.querySelector('#agGoal').value = ag.goal;\n        }\n        function openAuto() {\n            renderAuto();\n            document.getElementById('autoGen').classList.remove('hidden');\n            document.body.classList.add('modal-open');\n            document.getElementById('agScroll').scrollTop = 0;\n        }\n        function closeAuto() {\n            const el = document.getElementById('autoGen');\n            if (!el) return;\n            el.classList.add('hidden');\n            if (document.getElementById('picker').classList.contains('hidden')) document.body.classList.remove('modal-open');\n        }\n\n        (function () {\n            const el = document.getElementById('autoGen');\n            document.getElementById('autoProgram').addEventListener('click', openAuto);\n            document.getElementById('agClose').addEventListener('click', closeAuto);\n            document.getElementById('agEquip').addEventListener('change', e => { ag.equip = e.target.value; });\n            document.getElementById('agGoal').addEventListener('change', e => { ag.goal = e.target.value; });\n            el.addEventListener('click', (e) => {\n                const b = e.target.closest('button');\n                if (!b) return;\n                if (b.dataset.dur) { ag.dur = parseInt(b.dataset.dur, 10); renderAuto(); }\n                else if (b.dataset.preset) { ag.areas = new Set(AUTO_PRESETS[+b.dataset.preset][1]); renderAuto(); }\n                else if (b.dataset.area) { ag.areas.has(b.dataset.area) ? ag.areas.delete(b.dataset.area) : ag.areas.add(b.dataset.area); renderAuto(); }\n                else if (b.id === 'agGo') {\n                    if (!ag.areas.size) { showToast('Pick at least one body area'); return; }\n                    closeAuto();\n                    openAutoEditor({ dur: ag.dur, equip: ag.equip, goal: ag.goal, areas: new Set(ag.areas) });\n                }\n            });\n        })();\n\n        /* ---------- Program editor and exercise picker ---------- */\n        const REST_OPTIONS = [30, 45, 60, 75, 90, 120, 150, 180, 240, 300];\n        const SET_OPTIONS = ['1', '2', '3', '4', '5', '6', '2-3', '3-4', '3-5', '4-5', '4-6', '1-3'];\n        let ed = null;\n        const pk = { q: '', group: 'All', equip: 'dbbw', added: 0 };\n\n        function cleanText(s, max) {\n            return String(s == null ? '' : s).replace(/[\u003c>\"`]/g, '').replace(/\\s+/g, ' ').trim().slice(0, max);\n        }\n        function restLabel(s) {\n            const m = Math.floor(s / 60), r = s % 60;\n            return m ? (r ? `${m} min ${r}` : `${m} min`) : `${r} sec`;\n        }\n        function restOptions(sel, rec) {\n            const vals = REST_OPTIONS.slice();\n            if (!vals.includes(sel)) vals.push(sel);\n            vals.sort((a, b) => a - b);\n            return vals.map(v => `\u003coption value=\"${v}\"${v === sel ? ' selected' : ''}>${restLabel(v)}${v === rec ? ' ★' : ''}\u003c/option>`).join('');\n        }\n        function setOptions(sel) {\n            const vals = SET_OPTIONS.includes(sel) ? SET_OPTIONS : SET_OPTIONS.concat([sel]);\n            return vals.map(o => `\u003coption value=\"${escHTML(o)}\"${o === sel ? ' selected' : ''}>${escHTML(o)}\u003c/option>`).join('');\n        }\n        function builtinMatch(name) {\n            return HOME_EXERCISES.concat(GYM_EXERCISES).find(e => e.exercise === name) || null;\n        }\n\n        // Rest period for an exercise: your override, else the exercise's own value, else best-practice default\n        function restFor(plan, index) {\n            const list = PLANS[plan] && PLANS[plan][1];\n            const ex = list && list[index];\n            if (!ex) return 90;\n            if (!ownsRest(plan)) {\n                const ov = data._restOv && data._restOv[plan] && data._restOv[plan][index];\n                if (typeof ov === 'number' && ov > 0) return ov;\n            }\n            return typeof ex.rest === 'number' ? ex.rest : KIND[ex.kind].rest;\n        }\n        function setExerciseRest(plan, index, sec) {\n            if (ownsRest(plan)) {\n                PLANS[plan][1][index].rest = sec;\n            } else {\n                data._restOv = data._restOv || {};\n                data._restOv[plan] = data._restOv[plan] || {};\n                data._restOv[plan][index] = sec;\n            }\n            saveData();\n        }\n\n        function newProgramId() {\n            let id;\n            do { id = 'p' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36); } while (customPrograms()[id]);\n            return id;\n        }\n        function uniqueName(name, exceptId) {\n            const taken = new Set(planIds().filter(p => p !== exceptId).map(p => planName(p).toLowerCase()));\n            let n = name, i = 2;\n            while (taken.has(n.toLowerCase())) n = `${name} ${i++}`;\n            return n;\n        }\n\n        function openEditor(mode, baseId) {\n            if (mode === 'new') {\n                ed = { baseId: null, builtin: false, name: '', rows: [], dirty: false };\n            } else {\n                const list = PLANS[baseId][1], links = getLinks(baseId), builtin = !isCustom(baseId);\n                ed = {\n                    baseId, builtin, dirty: false,\n                    name: builtin ? 'My ' + planName(baseId) : planName(baseId),\n                    rows: list.map((ex, i) => ({\n                        exercise: ex.exercise, bodyPart: ex.bodyPart, kind: ex.kind, repRange: ex.repRange, sets: ex.sets,\n                        rest: restFor(baseId, i), video: ex.video || '', orig: i, ssNext: !!links[i], free: !dbFind(ex.exercise)\n                    }))\n                };\n            }\n            go('editor');\n        }\n\n        function renderEditor() {\n            const box = document.getElementById('editorContainer');\n            if (!ed) { box.innerHTML = ''; return; }\n            const last = ed.rows.length - 1;\n            const intro = !ed.baseId\n                ? 'Build your program from the exercise database, then set the sets, reps and rest for each exercise.'\n                : ed.builtin\n                    ? `Save &amp; overwrite changes the ${escHTML(planName(ed.baseId))} plan itself (you can reset it to the original from the menu). Save as new program keeps it untouched and uses the name below.`\n                    : 'Save &amp; overwrite updates this program (logged sets follow their exercises). Save as new program keeps the original and creates a copy with the name below.';\n\n            const rowsHTML = ed.rows.map((r, i) => {\n                const rec = KIND[r.kind].rest;\n                const groups = GROUPS.includes(r.bodyPart) ? GROUPS : GROUPS.concat([r.bodyPart]);\n                const swap = `\u003cselect class=\"fld ed-swap\" aria-label=\"Change exercise\">${swapOptions(r)}\u003c/select>`;\n                const head = r.free\n                    ? `${swap}\u003cinput class=\"fld ed-ex-name\" type=\"text\" maxlength=\"50\" placeholder=\"Exercise name\" value=\"${escHTML(r.exercise)}\" aria-label=\"Exercise name\">\n                       \u003cdiv class=\"ed-free\">\n                         \u003cselect class=\"fld ed-group-sel\" aria-label=\"Muscle group\">${groups.map(g => `\u003coption${g === r.bodyPart ? ' selected' : ''}>${escHTML(g)}\u003c/option>`).join('')}\u003c/select>\n                         \u003cselect class=\"fld ed-kind-sel\" aria-label=\"Exercise type\">${Object.keys(KIND).map(k => `\u003coption value=\"${k}\"${k === r.kind ? ' selected' : ''}>${KIND[k].label}\u003c/option>`).join('')}\u003c/select>\n                       \u003c/div>`\n                    : `${swap}\n                       \u003cdiv class=\"ed-group\">${escHTML(r.bodyPart)} · ${escHTML(KIND[r.kind].label)}\u003c/div>`;\n                return `\n                \u003cdiv class=\"ed-row\" data-i=\"${i}\">\n                    \u003cdiv class=\"ed-row-head\">\n                        \u003cdiv class=\"ed-row-title\">\u003cspan class=\"ed-num\">${i + 1}\u003c/span>\u003cdiv class=\"ed-row-main\">${head}\u003c/div>\u003c/div>\n                        \u003cdiv class=\"ed-row-btns\">\n                            \u003cbutton type=\"button\" data-act=\"up\" aria-label=\"Move up\"${i === 0 ? ' disabled' : ''}>&#9650;\u003c/button>\n                            \u003cbutton type=\"button\" data-act=\"down\" aria-label=\"Move down\"${i === last ? ' disabled' : ''}>&#9660;\u003c/button>\n                            \u003cbutton type=\"button\" data-act=\"rm\" class=\"danger\" aria-label=\"Remove exercise\">&#10005;\u003c/button>\n                        \u003c/div>\n                    \u003c/div>\n                    \u003cdiv class=\"ed-fields\">\n                        \u003clabel>Sets\u003cselect class=\"fld ed-sets\">${setOptions(r.sets)}\u003c/select>\u003c/label>\n                        \u003clabel>Reps\u003cinput class=\"fld ed-reps\" type=\"text\" maxlength=\"12\" value=\"${escHTML(r.repRange)}\" placeholder=\"8-12\">\u003c/label>\n                        \u003clabel>Rest\u003cselect class=\"fld ed-rest\">${restOptions(r.rest, rec)}\u003c/select>\u003c/label>\n                    \u003c/div>\n                    \u003cdiv class=\"ed-row-foot\">\n                        ${i \u003c last ? `\u003cbutton type=\"button\" class=\"ss-toggle\" data-act=\"ss\">⛓ Superset with next exercise: ${r.ssNext ? 'On' : 'Off'}\u003c/button>` : ''}\n                        \u003cdetails class=\"ed-more\">\u003csummary>Video link\u003c/summary>\u003cinput class=\"fld ed-video\" type=\"url\" inputmode=\"url\" placeholder=\"https://...\" value=\"${escHTML(r.video || '')}\">\u003c/details>\n                    \u003c/div>\n                \u003c/div>`;\n            }).join('');\n\n            let buttons;\n            if (ed.baseId) {\n                buttons = `\u003cbutton type=\"button\" class=\"ed-primary\" data-act=\"save\">Save &amp; overwrite\u003c/button>\u003cbutton type=\"button\" data-act=\"saveNew\">Save as new program\u003c/button>`;\n            } else {\n                buttons = `\u003cbutton type=\"button\" class=\"ed-primary\" data-act=\"saveNew\">Create program\u003c/button>`;\n            }\n\n            box.innerHTML = `\n                ${ed.auto ? `\u003cdiv class=\"ed-auto\">\u003cspan>${escHTML(ed.note || '')}\u003c/span>\u003cbutton type=\"button\" data-act=\"regen\">Regenerate\u003c/button>\u003c/div>` : ''}\n                \u003cp class=\"ed-intro\">${intro}\u003c/p>\n                \u003clabel class=\"ed-label\" for=\"edName\">Program name\u003c/label>\n                \u003cinput class=\"fld\" id=\"edName\" type=\"text\" maxlength=\"40\" placeholder=\"e.g. Upper body at home\" value=\"${escHTML(ed.name)}\">\n                \u003cdetails class=\"ed-guide\">\n                    \u003csummary>Rest guide (★ = recommended)\u003c/summary>\n                    \u003cul>\n                        \u003cli>\u003cstrong>2 min 30\u003c/strong>: big leg and hip lifts (squats, deadlifts, leg press)\u003c/li>\n                        \u003cli>\u003cstrong>2 min\u003c/strong>: upper-body presses, rows and pulldowns\u003c/li>\n                        \u003cli>\u003cstrong>1 min 30\u003c/strong>: single-leg work, flyes, pullovers, dips\u003c/li>\n                        \u003cli>\u003cstrong>1 min\u003c/strong>: curls, raises, pushdowns and other isolation\u003c/li>\n                        \u003cli>\u003cstrong>45 sec\u003c/strong>: core and calves\u003c/li>\n                    \u003c/ul>\n                    \u003cp>Based on common ACSM/NSCA guidance: roughly 2 to 3 minutes for heavy multi-joint lifts, 1 to 2 for general muscle-building work, and 30 to 60 seconds for small isolation work. Treat these as starting points and adjust to how you feel.\u003c/p>\n                \u003c/details>\n                \u003ch2 class=\"section-label ed-count\">${ed.rows.length} exercise${ed.rows.length === 1 ? '' : 's'}\u003c/h2>\n                ${rowsHTML || '\u003cp class=\"ed-empty\">No exercises yet. Tap the button below to add some.\u003c/p>'}\n                \u003cbutton type=\"button\" class=\"ed-add\" data-act=\"add\">+ Add exercise\u003c/button>\n                \u003cdiv class=\"ed-actions\">${buttons}\u003c/div>`;\n        }\n\n        function swapOptions(r) {\n            let h = r.free ? `\u003coption value=\"\">Custom: ${escHTML(r.exercise || 'new exercise')}\u003c/option>` : '\u003coption value=\"__custom\">Custom exercise...\u003c/option>';\n            GROUPS.forEach(g => {\n                const items = EXERCISE_DB.filter(e => e.bodyPart === g).sort((a, b) => a.exercise.localeCompare(b.exercise));\n                if (!items.length) return;\n                h += `\u003coptgroup label=\"${escHTML(g)}\">` + items.map(e =>\n                    `\u003coption value=\"${escHTML(e.exercise)}\"${!r.free && e.exercise === r.exercise ? ' selected' : ''}>${escHTML(e.exercise)}\u003c/option>`).join('') + '\u003c/optgroup>';\n            });\n            return h;\n        }\n\n        function swapRow(r, item) {\n            const oldK = KIND[r.kind], ob = builtinMatch(r.exercise), nb = builtinMatch(item.exercise), nk = KIND[item.kind];\n            const repsWereDefault = r.repRange === (ob ? ob.repRange : oldK.reps) && r.sets === (ob ? ob.sets : oldK.sets);\n            const restWasDefault = r.rest === oldK.rest;\n            if (repsWereDefault) { r.repRange = nb ? nb.repRange : nk.reps; r.sets = nb ? nb.sets : nk.sets; }\n            if (restWasDefault) r.rest = nk.rest;\n            r.exercise = item.exercise; r.bodyPart = item.bodyPart; r.kind = item.kind;\n            r.video = nb && nb.video ? nb.video : '';\n            r.free = false;\n            r.orig = null; // a different exercise, so the old logged sets do not carry over\n        }\n\n        // Move logged data between exercise positions. mapFn(oldIndex) -> new index, or -1 to drop it.\n        function relocateData(id, mapFn) {\n            const prefix = id + '_', moved = [];\n            Object.keys(data).forEach(k => {\n                if (!k.startsWith(prefix)) return;\n                const m = k.match(/^(.+_[a-z]{3})_(\\d+)$/);\n                if (!m) return;\n                moved.push([m[1], mapFn(parseInt(m[2], 10)), data[k]]);\n                delete data[k];\n            });\n            moved.forEach(([base, n, val]) => { if (n >= 0) data[`${base}_${n}`] = val; });\n        }\n\n        function hasLogs(id, orig) {\n            const re = new RegExp('^' + id + '_\\\\d+_[a-z]{3}_' + orig + '$');\n            return Object.keys(data).some(k => re.test(k) && data[k] && data[k].loggedSets && data[k].loggedSets.length);\n        }\n\n        async function saveEditor(asNew) {\n            if (!ed) return;\n            if (!ed.rows.length) { showToast('Add at least one exercise'); return; }\n            const inPlace = !asNew && !!ed.baseId;\n            let name = cleanText(ed.name, 40);\n            if (!name && !(inPlace && ed.builtin)) { showToast('Give the program a name'); const n = document.getElementById('edName'); if (n) n.focus(); return; }\n            const seen = new Set();\n            const exercises = [];\n            for (let i = 0; i \u003c ed.rows.length; i++) {\n                const r = ed.rows[i];\n                const exName = cleanText(r.exercise, 50);\n                if (!exName) { showToast(`Exercise ${i + 1} needs a name`); return; }\n                if (seen.has(exName.toLowerCase())) { showToast(`\"${exName}\" appears twice`); return; }\n                seen.add(exName.toLowerCase());\n                if (!/^\\d{1,2}(-\\d{1,2})?$/.test(r.sets)) { showToast(`Check the sets for ${exName}`); return; }\n                const reps = cleanText(r.repRange, 12);\n                if (!reps) { showToast(`Enter reps for ${exName}`); return; }\n                const video = String(r.video || '').trim();\n                if (video && !/^https?:\\/\\//i.test(video)) { showToast(`Video link for ${exName} must start with https://`); return; }\n                const ex = { exercise: exName, bodyPart: cleanText(r.bodyPart, 20) || 'Other', repRange: reps, sets: r.sets, kind: r.kind, rest: r.rest };\n                if (video) ex.video = video;\n                exercises.push(ex);\n            }\n            const links = {};\n            ed.rows.forEach((r, i) => { if (r.ssNext && i \u003c ed.rows.length - 1) links[i] = true; });\n\n            const progs = customPrograms();\n            let id;\n            if (inPlace) {\n                id = ed.baseId;\n                const keep = new Set(ed.rows.map(r => r.orig).filter(o => o !== null));\n                const lost = [];\n                PLANS[id][1].forEach((ex, o) => { if (!keep.has(o) && hasLogs(id, o)) lost.push(ex.exercise); });\n                if (lost.length && !(await askConfirm(`Saving removes the logged sets for: ${lost.join(', ')}. Continue?`, 'Save anyway', true))) return;\n                relocateData(id, o => ed.rows.findIndex(r => r.orig === o));\n                if (isCustom(id)) {\n                    name = uniqueName(name, id);\n                    progs[id] = { name, created: progs[id].created || Date.now(), exercises };\n                } else {\n                    name = planName(id);\n                    data._overrides = (data._overrides && typeof data._overrides === 'object') ? data._overrides : {};\n                    data._overrides[id] = { exercises };\n                    if (data._restOv) delete data._restOv[id];\n                }\n            } else {\n                id = newProgramId();\n                name = uniqueName(name, null);\n                progs[id] = { name, created: Date.now(), exercises };\n            }\n            data._supersets = Object.assign({}, data._supersets || {}, { [id]: links });\n            saveData();\n            rebuildPlans();\n            showToast(inPlace ? `Updated \"${name}\"` : `Saved \"${name}\"`);\n            ed = null;\n            go('home');\n        }\n\n        async function resetBuiltin(id) {\n            if (!hasOverride(id)) return;\n            const orig = BUILTIN_PLANS[id].exercises, cur = PLANS[id][1];\n            const mapFn = o => cur[o] ? orig.findIndex(e => e.exercise === cur[o].exercise) : -1;\n            const lost = [];\n            cur.forEach((ex, o) => { if (mapFn(o) \u003c 0 && hasLogs(id, o)) lost.push(ex.exercise); });\n            const msg = lost.length\n                ? `Reset ${planName(id)} to the original plan? Logged sets for ${lost.join(', ')} will be removed.`\n                : `Reset ${planName(id)} to the original plan? Your logged sets stay with their exercises.`;\n            if (!(await askConfirm(msg, 'Reset', true))) return;\n            relocateData(id, mapFn);\n            delete data._overrides[id];\n            if (data._supersets) delete data._supersets[id];\n            if (data._restOv) delete data._restOv[id];\n            saveData(); rebuildPlans(); renderExercises();\n            showToast(`${planName(id)} reset to original`);\n        }\n\n        function duplicateProgram(id) {\n            const src = PLANS[id] && PLANS[id][1];\n            if (!src) return;\n            const nid = newProgramId();\n            customPrograms()[nid] = {\n                name: uniqueName(cleanText(planName(id) + ' copy', 40), null), created: Date.now(),\n                exercises: JSON.parse(JSON.stringify(src.map((ex, i) => Object.assign({}, ex, { rest: restFor(id, i) }))))\n            };\n            data._supersets = Object.assign({}, data._supersets || {}, { [nid]: Object.assign({}, getLinks(id)) });\n            saveData(); rebuildPlans(); renderExercises();\n            showToast('Program duplicated');\n        }\n\n        async function deleteProgram(id) {\n            const builtin = !isCustom(id);\n            const ok = await askConfirm(`Delete \"${planName(id)}\" and everything you logged in it? This cannot be undone.`, 'Delete', true);\n            if (!ok) return;\n            Object.keys(data).forEach(k => { if (k.startsWith(id + '_')) delete data[k]; });\n            if (builtin) {\n                data._hidden = Object.assign({}, hiddenPlans(), { [id]: true });\n                if (data._overrides) delete data._overrides[id];\n                if (data._restOv) delete data._restOv[id];\n            } else {\n                delete customPrograms()[id];\n            }\n            if (data._supersets) delete data._supersets[id];\n            saveData(); rebuildPlans(); renderExercises();\n            showToast('Program deleted');\n        }\n\n        /* Editor events */\n        (function () {\n            const box = document.getElementById('editorContainer');\n            box.addEventListener('input', (e) => {\n                if (!ed) return;\n                const t = e.target;\n                if (t.id === 'edName') { ed.name = t.value; ed.dirty = true; return; }\n                const rowEl = t.closest('.ed-row');\n                if (!rowEl) return;\n                const r = ed.rows[+rowEl.dataset.i];\n                if (t.classList.contains('ed-ex-name')) r.exercise = t.value;\n                else if (t.classList.contains('ed-reps')) r.repRange = t.value;\n                else if (t.classList.contains('ed-video')) r.video = t.value;\n                else return;\n                ed.dirty = true;\n            });\n            box.addEventListener('change', (e) => {\n                if (!ed) return;\n                const t = e.target, rowEl = t.closest('.ed-row');\n                if (!rowEl) return;\n                const r = ed.rows[+rowEl.dataset.i];\n                if (t.classList.contains('ed-swap')) {\n                    const v = t.value, i = +rowEl.dataset.i;\n                    if (v === '') return;\n                    if (v === '__custom') {\n                        r.free = true; ed.dirty = true; renderEditor();\n                        const inp = document.querySelectorAll('.ed-row')[i].querySelector('.ed-ex-name');\n                        if (inp) inp.focus();\n                        return;\n                    }\n                    const item = dbFind(v);\n                    if (!item) return;\n                    if (ed.rows.some((o, j) => j !== i && o.exercise.toLowerCase() === item.exercise.toLowerCase())) {\n                        showToast('Already in this program'); renderEditor(); return;\n                    }\n                    swapRow(r, item); ed.dirty = true; renderEditor();\n                    return;\n                }\n                if (t.classList.contains('ed-sets')) r.sets = t.value;\n                else if (t.classList.contains('ed-rest')) r.rest = parseInt(t.value, 10);\n                else if (t.classList.contains('ed-group-sel')) r.bodyPart = t.value;\n                else if (t.classList.contains('ed-kind-sel')) {\n                    const wasRec = r.rest === KIND[r.kind].rest;\n                    r.kind = t.value;\n                    if (wasRec) r.rest = KIND[r.kind].rest;\n                    renderEditor();\n                } else return;\n                ed.dirty = true;\n            });\n            box.addEventListener('click', (e) => {\n                const b = e.target.closest('button[data-act]');\n                if (!b || !ed) return;\n                const act = b.dataset.act;\n                const rowEl = b.closest('.ed-row');\n                const i = rowEl ? +rowEl.dataset.i : -1;\n                if (act === 'up' && i > 0) { [ed.rows[i - 1], ed.rows[i]] = [ed.rows[i], ed.rows[i - 1]]; ed.dirty = true; renderEditor(); }\n                else if (act === 'down' && i \u003c ed.rows.length - 1) { [ed.rows[i + 1], ed.rows[i]] = [ed.rows[i], ed.rows[i + 1]]; ed.dirty = true; renderEditor(); }\n                else if (act === 'rm') { ed.rows.splice(i, 1); ed.dirty = true; renderEditor(); }\n                else if (act === 'ss') { ed.rows[i].ssNext = !ed.rows[i].ssNext; ed.dirty = true; renderEditor(); }\n                else if (act === 'regen' && ed.auto) {\n                    const g = autoGenerate({ dur: ed.auto.dur, equip: ed.auto.equip, goal: ed.auto.goal, areas: new Set(ed.auto.areas) });\n                    ed.rows = g.rows; ed.note = g.note; ed.dirty = true; renderEditor();\n                }\n                else if (act === 'add') openPicker();\n                else if (act === 'save') saveEditor(false);\n                else if (act === 'saveNew') saveEditor(true);\n            });\n        })();\n\n        /* ---------- Exercise picker ---------- */\n        function equipMatch(e) {\n            switch (pk.equip) {\n                case 'db': return e.equip === EQUIP_DB;\n                case 'bw': return e.equip === EQUIP_BW;\n                case 'mc': return e.equip === EQUIP_MC;\n                case 'all': return true;\n                default: return e.equip !== EQUIP_MC; // dumbbell + bodyweight\n            }\n        }\n\n        function openPicker() {\n            if (!ed) return;\n            pk.q = ''; pk.group = 'All'; pk.added = 0;\n            pk.equip = ed.baseId === 'gym' ? 'all' : 'dbbw';\n            document.getElementById('pkSearch').value = '';\n            document.getElementById('pkEquip').value = pk.equip;\n            document.getElementById('pkCName').value = '';\n            document.getElementById('picker').classList.remove('hidden');\n            document.body.classList.add('modal-open');\n            renderPickerChips();\n            renderPickerList();\n            document.getElementById('pkScroll').scrollTop = 0;\n        }\n\n        function closePicker(refresh) {\n            document.getElementById('picker').classList.add('hidden');\n            document.body.classList.remove('modal-open');\n            if (refresh && view === 'editor') renderEditor();\n        }\n\n        function renderPickerChips() {\n            const el = document.getElementById('pkChips');\n            el.innerHTML = ['All'].concat(GROUPS).map(g =>\n                `\u003cbutton type=\"button\" class=\"pk-chip${g === pk.group ? ' on' : ''}\" data-g=\"${escHTML(g)}\">${escHTML(g)}\u003c/button>`).join('');\n            document.getElementById('pkDone').textContent = pk.added ? `Done (${pk.added} added)` : 'Done';\n        }\n\n        function renderPickerList() {\n            const el = document.getElementById('pkList');\n            const tokens = pk.q.toLowerCase().split(/\\s+/).filter(Boolean);\n            const have = new Set(ed ? ed.rows.map(r => r.exercise.toLowerCase()) : []);\n            const gi = g => GROUPS.indexOf(g);\n            const list = EXERCISE_DB.filter(e => equipMatch(e) && (pk.group === 'All' || e.bodyPart === pk.group) &&\n                tokens.every(t => (e.exercise + ' ' + e.bodyPart + ' ' + e.equip).toLowerCase().includes(t)))\n                .sort((a, b) => gi(a.bodyPart) - gi(b.bodyPart) || a.exercise.localeCompare(b.exercise));\n            if (!list.length) {\n                el.innerHTML = `\u003cp class=\"pk-empty\">No matching exercises.${pk.q ? ` \u003cbutton type=\"button\" class=\"pk-fill\">Add \"${escHTML(cleanText(pk.q, 50))}\" as your own exercise\u003c/button>` : ''}\u003c/p>`;\n                return;\n            }\n            let html = '', lastG = null;\n            list.forEach(e => {\n                if (pk.group === 'All' && e.bodyPart !== lastG) { html += `\u003cdiv class=\"pk-group-head\">${escHTML(e.bodyPart)}\u003c/div>`; lastG = e.bodyPart; }\n                const inIt = have.has(e.exercise.toLowerCase());\n                html += `\u003cbutton type=\"button\" class=\"pk-item${inIt ? ' added' : ''}\" data-name=\"${escHTML(e.exercise)}\">\n                    \u003cspan class=\"pk-item-main\">\u003cspan class=\"pk-item-name\">${escHTML(e.exercise)}\u003c/span>\n                    \u003cspan class=\"pk-item-sub\">${escHTML(e.bodyPart)} · ${escHTML(e.equip)} · rest ${restLabel(KIND[e.kind].rest)}\u003c/span>\u003c/span>\n                    \u003cspan class=\"pk-item-add\">${inIt ? '✓' : '+'}\u003c/span>\u003c/button>`;\n            });\n            el.innerHTML = html;\n        }\n\n        function addRowFromDB(item) {\n            if (ed.rows.some(r => r.exercise.toLowerCase() === item.exercise.toLowerCase())) { showToast('Already in this program'); return false; }\n            const k = KIND[item.kind], b = builtinMatch(item.exercise);\n            ed.rows.push({\n                exercise: item.exercise, bodyPart: item.bodyPart, kind: item.kind,\n                repRange: b ? b.repRange : k.reps, sets: b ? b.sets : k.sets, rest: k.rest,\n                video: b && b.video ? b.video : '', orig: null, ssNext: false, free: false\n            });\n            ed.dirty = true;\n            pk.added++;\n            return true;\n        }\n\n        (function () {\n            const pickerEl = document.getElementById('picker');\n            document.getElementById('pkDone').addEventListener('click', () => closePicker(true));\n            document.getElementById('pkSearch').addEventListener('input', (e) => { pk.q = e.target.value; renderPickerList(); });\n            document.getElementById('pkEquip').addEventListener('change', (e) => { pk.equip = e.target.value; renderPickerList(); });\n            document.getElementById('pkChips').addEventListener('click', (e) => {\n                const b = e.target.closest('.pk-chip');\n                if (!b) return;\n                pk.group = b.dataset.g;\n                renderPickerChips(); renderPickerList();\n                document.getElementById('pkScroll').scrollTop = 0;\n            });\n            document.getElementById('pkList').addEventListener('click', (e) => {\n                const fill = e.target.closest('.pk-fill');\n                if (fill) {\n                    document.getElementById('pkCName').value = cleanText(pk.q, 50);\n                    document.getElementById('pkCName').focus();\n                    return;\n                }\n                const b = e.target.closest('.pk-item');\n                if (!b || !ed) return;\n                const item = dbFind(b.dataset.name);\n                if (!item) return;\n                if (addRowFromDB(item)) {\n                    b.classList.add('added');\n                    b.querySelector('.pk-item-add').textContent = '✓';\n                    document.getElementById('pkDone').textContent = `Done (${pk.added} added)`;\n                    showToast(`Added ${item.exercise}`);\n                }\n            });\n            document.getElementById('pkCAdd').addEventListener('click', () => {\n                if (!ed) return;\n                const name = cleanText(document.getElementById('pkCName').value, 50);\n                if (!name) { showToast('Enter an exercise name'); return; }\n                if (ed.rows.some(r => r.exercise.toLowerCase() === name.toLowerCase())) { showToast('Already in this program'); return; }\n                const kind = document.getElementById('pkCKind').value, k = KIND[kind];\n                const known = dbFind(name);\n                ed.rows.push({\n                    exercise: known ? known.exercise : name,\n                    bodyPart: known ? known.bodyPart : document.getElementById('pkCGroup').value,\n                    kind: known ? known.kind : kind, repRange: k.reps, sets: k.sets, rest: (known ? KIND[known.kind] : k).rest,\n                    video: '', orig: null, ssNext: false, free: !known\n                });\n                ed.dirty = true; pk.added++;\n                document.getElementById('pkCName').value = '';\n                document.getElementById('pkDone').textContent = `Done (${pk.added} added)`;\n                showToast(`Added ${name}`);\n            });\n            document.getElementById('pkCGroup').innerHTML = GROUPS.map(g => `\u003coption>${g}\u003c/option>`).join('');\n            document.getElementById('pkCKind').innerHTML = Object.keys(KIND).map(k => `\u003coption value=\"${k}\">${KIND[k].label}\u003c/option>`).join('');\n            document.getElementById('pkCKind').value = 'is';\n        })();\n\n        initializeData();\n        {\n            const s = getStartDate();\n            const weeksIn = Math.floor((mondayOf(new Date()) - s) / 604800000) + 1;\n            currentWeek = Math.max(1, Math.min(16, weeksIn));\n        }\n        renderExercises();\n        startupBackupCheck();\n\n        // Seam for the combined app's shared backup (and later, Supabase storage)\n        window.AppHooks = {\n            id: 'training',\n            summary: () => { const n = Object.keys(data).filter(k => k[0] !== '_').length; return n + ' logged record' + (n === 1 ? '' : 's'); },\n            exportData: () => JSON.parse(JSON.stringify(data)),\n            importData: (o) => { data = { ...data, ...o }; rebuildPlans(); saveData(); renderExercises(); },\n            applyRemote: (ch) => { for (const c of ch) { if (c.deleted) delete data[c.key]; else data[c.key] = c.value; } rebuildPlans(); saveData(); renderExercises(); },\n            syncChanged: () => { updateBackupUI(); },\n            markBackedUp: () => { lsSet(LAST_KEY, String(Date.now())); updateBackupUI(); }\n        };\n    \u003c/script>\n\u003c/body>\n\u003c/html>\n"};

const toast=m=>{const t=$('#t');t.textContent=m;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,2200)};
const iso=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};

// ---------- shared backup ----------
const hooks=()=>{const o={};for(const k in fr){try{o[k]=fr[k].contentWindow.AppHooks||null}catch(e){o[k]=null}}return o};
const validT=o=>o&&typeof o=='object'&&!Array.isArray(o)&&Object.keys(o).some(k=>k[0]=='_'||/_\d+_(mon|tue|wed|thu|fri|sat|sun)_/.test(k));
const validC=o=>o&&typeof o=='object'&&o.days&&typeof o.days=='object'&&!Array.isArray(o.days);
function detect(o){
  if(!o||typeof o!='object'||Array.isArray(o))return null;
  if(o.app==='peter-apps'){const r={coaching:validC(o.coaching)?o.coaching:null,training:validT(o.training)?o.training:null};return r.coaching||r.training?r:null}
  if(validC(o))return{coaching:o,training:null};      // older coaching-only backup
  if(validT(o))return{coaching:null,training:o};      // older training-only backup
  return null}
function renderBk(){$('#bk').innerHTML=`<div class=w>${syncPanel()}<div class=p><small>Version ${BUILD}</small></div></div>`}
function bundle(){const h=hooks();if(!h.coaching||!h.training)return null;
  return JSON.stringify({app:'peter-apps',version:1,exported:new Date().toISOString(),coaching:h.coaching.exportData(),training:h.training.exportData()},null,1)}
function stamp(){LS('apps.lastBackup',String(Date.now()));const h=hooks();for(const k in h){try{h[k]&&h[k].markBackedUp()}catch(e){}}if(tab=='backup')renderBk()}
async function doExport(share){
  const j=bundle();if(!j)return alert('The apps are still loading. Try again in a moment.');
  const name=`apps-backup-${iso()}.json`;
  if(share){const f=new File([j],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){return}}
    else return alert('Sharing is not available here. Use Export instead.')}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
  stamp();toast('Backup saved')}
function doRestore(file){
  file.text().then(x=>{
